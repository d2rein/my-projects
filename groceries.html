<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Weekly Grocery Shop</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f4efe8;
      --bg-2: #e3d7c7;
      --card: rgba(255, 252, 246, 0.92);
      --card-strong: #fffaf2;
      --ink: #2b2116;
      --muted: #7b6857;
      --line: rgba(93, 67, 40, 0.14);
      --accent: #c7632b;
      --accent-2: #f3dccb;
      --accent-3: #fff0e4;
      --green: #2d7a44;
      --green-soft: #e9f6ed;
      --shadow: 0 16px 40px rgba(54, 34, 12, 0.12);
      --radius: 24px;
      --radius-sm: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.55), transparent 40%),
        linear-gradient(180deg, #fbf6ef 0%, #f3ebdf 42%, #eadcc7 100%);
      padding-bottom: 126px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .shell {
      max-width: 1500px;
      width: 100%;
      margin: 0 auto;
      padding: 10px 10px 0;
    }

    .utility {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 10px 0 12px;
      background: linear-gradient(180deg, rgba(251, 246, 239, 0.95), rgba(251, 246, 239, 0.72), transparent);
      backdrop-filter: blur(12px);
    }

    .utility-grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }

    .sync-status {
      color: var(--muted);
      font-size: 0.78rem;
      padding: 0 4px;
    }

    .pill {
      padding: 9px 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid var(--line);
      color: var(--ink);
      font-weight: 700;
      min-width: 0;
      font-size: 0.74rem;
      letter-spacing: 0.01em;
      white-space: nowrap;
      text-align: center;
    }

    .pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .tab {
      display: none;
    }

    .tab.active {
      display: block;
    }

    .panel {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 10px;
    }

    .panel + .panel {
      margin-top: 12px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-end;
      margin: 0 2px 8px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 1.04rem;
    }

    .hint {
      color: var(--muted);
      font-size: 0.8rem;
      text-align: right;
    }

    .toolbar {
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 0 8px;
    }

    body.editing .toolbar {
      display: flex;
    }

    .toolbar button,
    .button {
      padding: 8px 10px;
      border-radius: 12px;
      font-weight: 700;
      border: 1px solid transparent;
      font-size: 0.82rem;
    }

    .button-primary {
      background: var(--accent);
      color: #fff;
    }

    .button-soft {
      background: rgba(255, 255, 255, 0.82);
      border-color: var(--line);
      color: var(--ink);
    }

    .button-danger {
      background: #fde6e0;
      color: #972d17;
    }

    .meal-grid,
    .item-grid,
    .shopping-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .meal-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .meal-card {
      position: relative;
      min-height: 96px;
      padding: 0;
      overflow: hidden;
      border-radius: 22px;
      background: #5e4530;
      box-shadow: var(--shadow);
      border: 2px solid transparent;
      isolation: isolate;
      color: #fff;
      text-align: left;
    }

    .meal-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(34, 20, 9, 0.08), rgba(34, 20, 9, 0.78)),
        var(--meal-image, linear-gradient(135deg, #9b5d39, #524330));
      background-size: cover;
      background-position: center;
      transform: scale(1.03);
      z-index: -2;
      transition: transform 180ms ease;
    }

    .meal-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(0, 0, 0, 0));
      z-index: -1;
    }

    .meal-card:hover::before {
      transform: scale(1.07);
    }

    .meal-card.selected {
      border-color: rgba(45, 122, 68, 0.95);
      box-shadow: 0 0 0 4px rgba(45, 122, 68, 0.16), var(--shadow);
    }

    body.editing .meal-card {
      border-color: rgba(255, 255, 255, 0.38);
    }

    .meal-badge,
    .edit-badge {
      position: absolute;
      top: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.64rem;
      font-weight: 700;
    }

    .meal-badge {
      right: 10px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--green);
      opacity: 0;
      transform: translateY(-4px);
      transition: 160ms ease;
    }

    .meal-card.selected .meal-badge {
      opacity: 1;
      transform: translateY(0);
    }

    .edit-badge {
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink);
      display: none;
    }

    body.editing .edit-badge {
      display: inline-block;
    }

    .meal-copy {
      position: absolute;
      inset: auto 8px 8px 8px;
    }

    .meal-name {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.05;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-card,
    .shopping-card {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 7px 9px;
      border-radius: 14px;
      background: var(--card-strong);
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(73, 48, 19, 0.08);
      color: var(--ink);
      text-align: left;
    }

    .item-card.selected,
    .shopping-card.done {
      background: var(--green-soft);
      border-color: rgba(45, 122, 68, 0.28);
    }

    .check,
    .meal-badge,
    .meal-meta {
      display: none !important;
    }

    .card-main {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 0.86rem;
      font-weight: 700;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-sub {
      color: var(--muted);
      font-size: 0.72rem;
      margin-top: 1px;
    }

    body:not(.editing) .meal-list .card-sub {
      display: none;
    }

    .done .card-title {
      text-decoration: line-through;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      padding: 5px 9px;
      font-size: 0.74rem;
      border-radius: 999px;
      background: var(--accent-3);
      color: var(--accent);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .category-block + .category-block {
      margin-top: 10px;
    }

    #otherCards,
    #shoppingList {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    #otherCards .category-block,
    #shoppingList .category-block {
      margin-top: 0;
    }

    .empty {
      padding: 24px 18px;
      text-align: center;
      color: var(--muted);
      border-radius: 18px;
      border: 1px dashed rgba(93, 67, 40, 0.22);
      background: rgba(255, 255, 255, 0.46);
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(1500px, calc(100vw - 8px));
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: rgba(255, 251, 244, 0.92);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-bottom: 0;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -16px 36px rgba(58, 38, 15, 0.12);
      z-index: 11;
    }

    .nav-button {
      padding: 18px 10px;
      border-radius: 18px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 1.08rem;
    }

    .nav-button.active {
      background: var(--accent-2);
      color: var(--accent);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
    }

    .modal.open {
      display: block;
    }

    .scrim {
      position: absolute;
      inset: 0;
      background: rgba(27, 18, 9, 0.42);
    }

    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 88vh;
      overflow: auto;
      padding: 18px;
      background: #fffaf4;
      border-radius: 26px 26px 0 0;
      box-shadow: 0 -18px 40px rgba(31, 19, 7, 0.18);
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .sheet-head h3 {
      margin: 0;
      font-size: 1.4rem;
    }

    .field {
      display: grid;
      gap: 6px;
      margin: 12px 0;
    }

    .field label {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .cat-block {
      margin: 14px 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.7);
    }

    .cat-head {
      padding: 11px 13px;
      background: #f4ece1;
      font-weight: 700;
    }

    .line {
      display: grid;
      grid-template-columns: 1fr 120px 42px;
      gap: 8px;
      padding: 8px 10px;
      border-top: 1px solid var(--line);
    }

    .line input,
    .line select {
      min-width: 0;
      padding: 10px 11px;
      border-radius: 11px;
      border: 1px solid var(--line);
    }

    .mini-danger {
      border-radius: 11px;
      background: #fde6e0;
      color: #972d17;
      font-weight: 700;
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    @media (min-width: 720px) {
      .meal-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .meal-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .item-grid,
      .shopping-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #otherCards {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: start;
      }

      #shoppingList {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: start;
      }

      body.single-column #otherCards,
      body.single-column #shoppingList {
        grid-template-columns: 1fr;
      }

      .sheet {
        left: 50%;
        right: auto;
        bottom: 22px;
        width: min(760px, calc(100vw - 28px));
        transform: translateX(-50%);
        border-radius: 26px;
      }
    }

    @media (max-width: 560px) {
      .meal-grid,
      .item-grid,
      .shopping-grid {
        grid-template-columns: 1fr;
      }

      .line {
        grid-template-columns: 1fr;
      }
    }

    body.single-column .item-grid,
    body.single-column .shopping-grid,
    body.single-column .meal-grid,
    body.single-column .meal-list {
      grid-template-columns: 1fr;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="utility">
      <div class="utility-grid">
        <button id="editToggle" class="pill" type="button">Edit</button>
        <button id="mealViewBtn" class="pill" type="button">Cards</button>
        <button id="columnToggleBtn" class="pill" type="button">2 Col</button>
        <button id="fontDownBtn" class="pill" type="button">Text -</button>
        <button id="fontUpBtn" class="pill" type="button">Text +</button>
        <button id="refreshCloudBtn" class="pill" type="button">Refresh</button>
        <button id="saveCloudBtn" class="pill" type="button">Save</button>
        <button id="resetWeekBtn" class="pill" type="button">Reset Week</button>
        <button id="resetBtn" class="pill" type="button">Reset All</button>
      </div>
      <div id="syncStatus" class="sync-status">Refresh pulls the latest shared list. Save pushes your current list.</div>
    </div>

    <main>
      <section id="tab-meals" class="tab active">
        <div class="panel">
          <div class="section-head"><div class="hint" id="mealHint">Tap cards to add them to this week.</div></div>
          <div class="toolbar"><button id="addMealBtn" class="button button-primary" type="button">Add meal</button></div>
          <div id="mealCards" class="meal-grid"></div>
        </div>
      </section>

      <section id="tab-items" class="tab">
        <div class="panel">
          <div class="section-head"><div class="hint">Produce, dairy, meat, bread and other.</div></div>
          <div class="toolbar"><button id="addItemBtn" class="button button-primary" type="button">Add checklist item</button></div>
          <div id="otherCards"></div>
        </div>
      </section>

      <section id="tab-list" class="tab">
        <div class="panel">
          <div class="section-head"><div class="hint">Tap any item when it goes in the trolley.</div></div>
          <div>
            <strong>Selected meals</strong>
            <div id="selectedMeals" class="chip-row"></div>
          </div>
        </div>
        <div class="panel">
          <div id="shoppingList"></div>
        </div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav">
    <button class="nav-button active" type="button" data-tab="meals">Meals</button>
    <button class="nav-button" type="button" data-tab="items">Other items</button>
    <button class="nav-button" type="button" data-tab="list">Shopping list</button>
  </nav>

  <div id="modal" class="modal">
    <div class="scrim" data-close="true"></div>
    <div class="sheet">
      <div class="sheet-head">
        <h3 id="modalTitle"></h3>
        <button class="button button-soft" type="button" data-close="true">Close</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

    function slugify(value) {
      return String(value || "item")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function loadJson(key, fallback) {
      try {
        return JSON.parse(localStorage.getItem(key) || "null") || fallback;
      } catch (error) {
        return fallback;
      }
    }

    function loadState() {

      return String(value ?? "").replace(/[&<>"]/g, (match) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;"
      }[match]));
    }

    function setSyncStatus(message) {
      document.getElementById("syncStatus").textContent = message;

    function currentSnapshot() {
      return {
        state,
        done,
        localUpdatedAt: localMeta.lastLocalChangeAt || new Date().toISOString()
      };
    }

    async function refreshFromCloud(isAutomatic = false) {
      if (syncBusy) {
        return;
      }
      syncBusy = true;
      setSyncStatus(isAutomatic ? "Checking cloud copy..." : "Refreshing from cloud...");
      try {
        const response = await fetch("/api/grocery-sync");
        if (response.status === 404) {
          setSyncStatus(isAutomatic ? "No shared list yet. Save from one device to start syncing." : "No shared list exists yet.");
          return;
        }
        const payload = await response.json();
        if (!response.ok) {
          setSyncStatus(payload.error || "Cloud refresh failed.");
          return;
        }
        if (!payload.payload || !payload.payload.state || !payload.payload.done) {
          setSyncStatus("Cloud copy was missing data.");
          return;
        }
        state = payload.payload.state;
        done = payload.payload.done;
        sharedMeta.lastKnownRemoteUpdatedAt = payload.updatedAt || null;
        saveSharedMeta();
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
        localStorage.setItem(DONE_KEY, JSON.stringify(done));
        localMeta.lastLocalChangeAt = payload.payload.localUpdatedAt || payload.updatedAt || new Date().toISOString();
        saveLocalMeta();
        render();
        setSyncStatus("Cloud copy loaded. Last updated " + new Date(payload.updatedAt).toLocaleString() + ".");
      } catch (error) {
        setSyncStatus("Cloud refresh failed. Try again when you have signal.");
      } finally {
        syncBusy = false;
      }
    }

    async function saveToCloud() {
      if (syncBusy) {
        return;
      }
      syncBusy = true;
      setSyncStatus("Saving to cloud...");
      try {
        const response = await fetch("/api/grocery-sync", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            lastKnownUpdatedAt: sharedMeta.lastKnownRemoteUpdatedAt || null,
            payload: currentSnapshot()
          })
        });
        const payload = await response.json();
        if (!response.ok) {
          if (response.status === 409) {
            setSyncStatus("Cloud changed on another device. Refresh cloud first, then save again.");
            return;
          }
          setSyncStatus(payload.error || "Cloud save failed.");
          return;
        }
        sharedMeta.lastKnownRemoteUpdatedAt = payload.updatedAt || null;
        saveSharedMeta();
        setSyncStatus("Shared list saved. Refresh on the other device to pull it in.");
      } catch (error) {
        setSyncStatus("Cloud save failed. Try again when you have signal.");
      } finally {
        syncBusy = false;
      }
    }

    function bumpFontScale(delta) {

    function categoryOptions(selectedCategory) {
      return categories.map((category) => (
        "<option value=\"" + escapeHtml(category) + "\"" + (category === selectedCategory ? " selected" : "") + ">" + escapeHtml(category) + "</option>"
      )).join("");
    }

    function countIngredients(recipe) {
      return categories.reduce((total, category) => total + (recipe.ingredients[category] || []).filter(Boolean).length, 0);
    }

    function hashText(value) {
      let hash = 0;
      for (let index = 0; index < value.length; index += 1) {
        hash = ((hash << 5) - hash + value.charCodeAt(index)) | 0;
      }
      return Math.abs(hash);
    }

    function mealImage(recipe) {
      return recipe.image || imageCache[recipe.id] || fallbackImages[hashText(recipe.name) % fallbackImages.length];
    }

    async function fetchMealImage(recipe) {
      if (recipe.image || imageCache[recipe.id]) {
        return;
      }
      const query = mealImageAliases[recipe.name.toLowerCase()] || recipe.name;
      try {
        const response = await fetch("https://www.themealdb.com/api/json/v1/1/search.php?s=" + encodeURIComponent(query));
        if (!response.ok) {
          return;
        }
        const payload = await response.json();
        const match = payload.meals && payload.meals[0];
        if (match && match.strMealThumb) {
          imageCache[recipe.id] = match.strMealThumb;
          saveImages();
          renderMeals();
          return;
        }
      } catch (error) {
        // Try the secondary source below.
      }
      try {
        const wikiImage = await fetchWikipediaImage(query);
        if (wikiImage) {
          imageCache[recipe.id] = wikiImage;
          saveImages();
          renderMeals();
        }
      } catch (error) {
        return;
      }
    }

    async function fetchWikipediaImage(query) {
      const url = new URL("https://en.wikipedia.org/w/api.php");
      url.searchParams.set("action", "query");
      url.searchParams.set("format", "json");
      url.searchParams.set("origin", "*");
      url.searchParams.set("generator", "search");
      url.searchParams.set("gsrsearch", query);
      url.searchParams.set("gsrlimit", "5");
      url.searchParams.set("prop", "pageimages|info");
      url.searchParams.set("pithumbsize", "900");
      url.searchParams.set("inprop", "url");

      const response = await fetch(url.toString());
      if (!response.ok) {
        return "";
      }

      const payload = await response.json();
      const pages = Object.values(payload?.query?.pages || {});
      const pageWithImage = pages.find((page) => page?.thumbnail?.source);
      return pageWithImage?.thumbnail?.source || "";
    }

    function queueMealImages() {
      state.recipes.forEach((recipe, index) => {
        if (!recipe.image && !imageCache[recipe.id]) {
          setTimeout(() => { fetchMealImage(recipe); }, index * 120);
        }
      });
    }

    function renderMeals() {
      const query = searchText();
      const wrap = document.getElementById("mealCards");
      const recipes = state.recipes.filter((recipe) => !query || recipe.name.toLowerCase().includes(query));
      if (!recipes.length) {
        wrap.innerHTML = "<div class=\"empty\">No meals match this search.</div>";
        return;
      }
      if (mealView === "list") {
        wrap.className = "meal-list";
        wrap.innerHTML = recipes.map((recipe) => (
          "<button class=\"item-card" + (recipe.selectedQty ? " selected" : "") + "\" type=\"button\" data-meal=\"" + escapeHtml(recipe.id) + "\">" +

        wrap.className = "meal-grid";

      wrap.querySelectorAll("[data-meal]").forEach((node) => {

          if (editing) {
            editMeal(id);
          } else {
            toggleMeal(id);
          }
        });
      });
    }

    function renderOther() {
      const query = searchText();
      const wrap = document.getElementById("otherCards");
      const groups = categories.map((category) => ({
        category,
        items: state.otherItems.filter((item) => item.category === category && (!query || item.name.toLowerCase().includes(query)))
      })).filter((group) => group.items.length);

      if (!groups.length) {
        wrap.innerHTML = "<div class=\"empty\">No checklist items match this search.</div>";
        return;
      }

      wrap.innerHTML = groups.map((group) => (
        "<div class=\"category-block\">" +
          "<div class=\"section-head\"><h2>" + escapeHtml(group.category) + "</h2><div class=\"hint\">" + group.items.length + "</div></div>" +
          "<div class=\"item-grid\">" +
            group.items.map((item) => (
              "<button class=\"item-card" + (item.selected ? " selected" : "") + "\" type=\"button\" data-item=\"" + escapeHtml(item.id) + "\">" +
                "<span class=\"check\">" + (item.selected ? "✓" : "") + "</span>" +
                "<div class=\"card-main\"><div class=\"card-title\">" + escapeHtml(item.name) + "</div></div>" +
              "</button>"
            )).join("") +
          "</div>" +
        "</div>"
      )).join("");

      wrap.querySelectorAll("[data-item]").forEach((node) => {
        node.addEventListener("click", () => {
          const id = node.dataset.item;
          if (editing) {
            editOther(id);
          } else {
            toggleOther(id);
          }
        });
      });
    }

    function buildShoppingList() {
      const list = Object.fromEntries(categories.map((category) => [category, new Map()]));
      const meals = state.recipes.filter((recipe) => recipe.selectedQty > 0);

      meals.forEach((recipe) => {
        categories.forEach((category) => {
          (recipe.ingredients[category] || []).filter(Boolean).forEach((item) => {
            const name = item.trim();
            if (!name) {
              return;
            }
            list[category].set(name, (list[category].get(name) || 0) + recipe.selectedQty);
          });
        });
      });

      state.otherItems.filter((item) => item.selected).forEach((item) => {
        list[item.category].set(item.name, (list[item.category].get(item.name) || 0) + 1);
      });

      return { meals, list };
    }

    function renderShopping() {
      const { meals, list } = buildShoppingList();
      const selectedMeals = document.getElementById("selectedMeals");
      const wrap = document.getElementById("shoppingList");

      selectedMeals.innerHTML = meals.length
        ? meals.map((meal) => "<span class=\"chip\">" + escapeHtml(meal.name) + (meal.selectedQty > 1 ? " × " + meal.selectedQty : "") + "</span>").join("")
        : "<div class=\"empty\">No meals selected yet.</div>";

      const blocks = categories.map((category) => {
        const entries = Array.from(list[category].entries());
        if (!entries.length) {
          return "";
        }
        return (
          "<div class=\"category-block\">" +
            "<div class=\"section-head\"><h2>" + escapeHtml(category) + "</h2><div class=\"hint\">" + entries.length + "</div></div>" +
            "<div class=\"shopping-grid\">" +
              entries.map(([name, qty]) => {
                const key = category + "|" + name;
                return (
                  "<button class=\"shopping-card" + (done[key] ? " done" : "") + "\" type=\"button\" data-done=\"" + escapeHtml(key) + "\">" +
                    "<span class=\"check\">" + (done[key] ? "✓" : "") + "</span>" +
                    "<div class=\"card-main\"><div class=\"card-title\">" + escapeHtml(name) + (qty > 1 ? " × " + qty : "") + "</div></div>" +
                  "</button>"
                );
              }).join("") +
            "</div>" +
          "</div>"
        );
      }).join("");

      wrap.innerHTML = blocks || "<div class=\"empty\">Pick meals or other checklist items to build your shopping list.</div>";
      wrap.querySelectorAll("[data-done]").forEach((node) => {
        node.addEventListener("click", () => {
          const key = node.dataset.done;
          done[key] = !done[key];
          saveDone();
          renderShopping();
        });
      });
    }

    function render() {
      renderMeals();
      renderOther();
      renderShopping();
    }

    function toggleMeal(mealId) {
      const recipe = state.recipes.find((entry) => entry.id === mealId);
      if (!recipe) {
        return;
      }
      recipe.selectedQty = recipe.selectedQty > 0 ? 0 : 1;
      saveState();
      render();
    }

    function toggleOther(itemId) {
      const item = state.otherItems.find((entry) => entry.id === itemId);
      if (!item) {
        return;
      }
      item.selected = !item.selected;
      saveState();
      render();
    }

    function resetCurrentWeek() {
      if (!window.confirm("Clear this week's meal selections, other items and ticked shopping progress?")) {
        return;
      }
      state.recipes.forEach((recipe) => {
        recipe.selectedQty = 0;
      });
      state.otherItems.forEach((item) => {
        item.selected = false;
      });
      done = {};
      localStorage.setItem(DONE_KEY, JSON.stringify(done));
      saveState();
      render();
      setSyncStatus("This week has been reset locally. Save to share the cleared list.");
    }

    function ingredientLineHtml(category, value, index) {
      return (
        "<div class=\"line\">" +
          "<input type=\"text\" value=\"" + escapeHtml(value) + "\" onchange=\"updateIngredient('" + escapeHtml(category) + "', " + index + ", this.value)\">" +
          "<select onchange=\"moveIngredient('" + escapeHtml(category) + "', " + index + ", this.value)\">" + categoryOptions(category) + "</select>" +
          "<button class=\"mini-danger\" type=\"button\" onclick=\"removeIngredient('" + escapeHtml(category) + "', " + index + ")\">×</button>" +
        "</div>"
      );
    }

    function currentMeal() {
      return state.recipes.find((entry) => entry.id === editingMealId) || null;
    }

    function currentOther() {
      return state.otherItems.find((entry) => entry.id === editingOtherId) || null;
    }

    function editMeal(mealId) {
      editingMealId = mealId;
      const recipe = currentMeal();
      if (!recipe) {
        return;
      }

      const blocks = categories.map((category) => {
        const lines = (recipe.ingredients[category] || []).length
          ? recipe.ingredients[category].map((item, index) => ingredientLineHtml(category, item, index)).join("")
          : "<div class=\"card-sub\" style=\"padding: 12px;\">No items yet.</div>";
        return (
          "<div class=\"cat-block\">" +
            "<div class=\"cat-head\">" + escapeHtml(category) + "</div>" +
            "<div>" + lines + "</div>" +
            "<div style=\"padding: 0 10px 10px;\"><button class=\"button button-soft\" type=\"button\" onclick=\"addIngredient('" + escapeHtml(category) + "')\">Add " + escapeHtml(category) + " item</button></div>" +
          "</div>"
        );
      }).join("");

      openModal("Edit meal", [
        "<div class=\"field\"><label>Meal name</label><input id=\"mealNameField\" type=\"text\" value=\"" + escapeHtml(recipe.name) + "\" oninput=\"renameMeal(this.value)\"></div>",
        "<div class=\"field\"><label>Image URL</label><input type=\"url\" value=\"" + escapeHtml(recipe.image || imageCache[recipe.id] || "") + "\" placeholder=\"Leave blank for auto image lookup\" oninput=\"updateMealImage(this.value)\"></div>",
        blocks,
        "<div class=\"sheet-actions\">",
        "<button class=\"button button-danger\" type=\"button\" onclick=\"deleteMeal()\">Delete meal</button>",
        "</div>"
      ].join(""));
    }

    function renameMeal(value) {
      const recipe = currentMeal();
      if (!recipe) {
        return;
      }
      recipe.name = value;
      saveState();
      render();
    }

    function updateMealImage(value) {
      const recipe = currentMeal();
      if (!recipe) {
        return;
      }
      recipe.image = value.trim();
      if (!recipe.image) {
        delete imageCache[recipe.id];
        saveImages();
      }
      saveState();
      renderMeals();
    }

    function addIngredient(category) {
      const recipe = currentMeal();
      if (!recipe) {
        return;
      }
      recipe.ingredients[category] = recipe.ingredients[category] || [];
      recipe.ingredients[category].push("New item");
      saveState();
      editMeal(recipe.id);
      renderShopping();
    }

    function updateIngredient(category, index, value) {
      const recipe = currentMeal();
      if (!recipe) {
        return;
      }
      recipe.ingredients[category][index] = value;
      saveState();
      render();
    }

    function moveIngredient(category, index, targetCategory) {
      const recipe = currentMeal();
      if (!recipe) {
        return;
      }
      const [item] = recipe.ingredients[category].splice(index, 1);
      recipe.ingredients[targetCategory] = recipe.ingredients[targetCategory] || [];
      recipe.ingredients[targetCategory].push(item);
      saveState();
      editMeal(recipe.id);
      render();
    }

    function removeIngredient(category, index) {
      const recipe = currentMeal();
      if (!recipe) {
        return;
      }
      recipe.ingredients[category].splice(index, 1);
      saveState();
      editMeal(recipe.id);
      render();
    }

    function deleteMeal() {
      if (!editingMealId) {
        return;
      }
      state.recipes = state.recipes.filter((entry) => entry.id !== editingMealId);
      delete imageCache[editingMealId];
      saveImages();
      saveState();
      closeModal();
      render();
    }

    function addMeal() {
      let index = 1;
      let name = "New meal";
      while (state.recipes.some((recipe) => recipe.name === name)) {
        index += 1;
        name = "New meal " + index;
      }
      const recipe = {
        id: slugify(name + "-" + Date.now()),
        name,
        selectedQty: 0,
        ingredients: Object.fromEntries(categories.map((category) => [category, []]))
      };
      state.recipes.push(recipe);
      saveState();
      render();
      editMeal(recipe.id);
    }

    function editOther(itemId) {
      editingOtherId = itemId;
      const item = currentOther();
      if (!item) {
        return;
      }
      openModal("Edit checklist item", [
        "<div class=\"field\"><label>Name</label><input type=\"text\" value=\"" + escapeHtml(item.name) + "\" oninput=\"updateOther('name', this.value)\"></div>",
        "<div class=\"field\"><label>Category</label><select onchange=\"updateOther('category', this.value)\">" + categoryOptions(item.category) + "</select></div>",
        "<div class=\"sheet-actions\"><button class=\"button button-danger\" type=\"button\" onclick=\"deleteOther()\">Delete item</button></div>"
      ].join(""));
    }

    function updateOther(key, value) {
      const item = currentOther();
      if (!item) {
        return;
      }
      item[key] = value;
      saveState();
      render();
    }

    function deleteOther() {
      if (!editingOtherId) {
        return;
      }
      state.otherItems = state.otherItems.filter((entry) => entry.id !== editingOtherId);
      saveState();
      closeModal();
      render();
    }

    function addOther() {
      const item = {
        id: slugify("new-item-" + Date.now()),
        name: "New item",
        category: "Other",
        selected: true
      };
      state.otherItems.push(item);
      saveState();
      render();
      editOther(item.id);
    }

    function resetData() {
      const clearedState = clone(STARTER_DATA);
      clearedState.recipes.forEach((recipe) => {
        recipe.selectedQty = 0;
      });
      clearedState.otherItems.forEach((item) => {
        item.selected = false;
      });
      state = clearedState;
      done = {};
      sharedMeta = { lastKnownRemoteUpdatedAt: null };
      localMeta = { lastLocalChangeAt: new Date().toISOString() };
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      localStorage.setItem(DONE_KEY, JSON.stringify(done));
      saveLocalMeta();
      saveSharedMeta();
      render();
      setSyncStatus("Everything has been unchecked locally.");
    }

    function moveTab(direction) {
      const index = TAB_ORDER.indexOf(activeTab);
      const nextIndex = index + direction;
      if (nextIndex < 0 || nextIndex >= TAB_ORDER.length) {
        return;
      }
      setTab(TAB_ORDER[nextIndex]);
    }

    function enableTabSwipe() {
      const main = document.querySelector("main");
      let startX = 0;
      let startY = 0;
      main.addEventListener("touchstart", (event) => {
        if (event.touches.length !== 1 || document.getElementById("modal").classList.contains("open")) {
          return;
        }
        const touch = event.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
      }, { passive: true });
      main.addEventListener("touchend", (event) => {
        if (!startX || !startY || document.getElementById("modal").classList.contains("open")) {
          startX = 0;
          startY = 0;
          return;
        }
        const touch = event.changedTouches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        startX = 0;
        startY = 0;
        if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.4) {
          return;
        }
        moveTab(dx < 0 ? 1 : -1);
      }, { passive: true });
    }

    document.getElementById("editToggle").addEventListener("click", () => setEditing(!editing));
    document.getElementById("mealViewBtn").addEventListener("click", toggleMealView);
    document.getElementById("columnToggleBtn").addEventListener("click", toggleColumnMode);
    document.getElementById("fontDownBtn").addEventListener("click", () => bumpFontScale(-0.08));
    document.getElementById("fontUpBtn").addEventListener("click", () => bumpFontScale(0.08));
    document.getElementById("addMealBtn").addEventListener("click", addMeal);
    document.getElementById("addItemBtn").addEventListener("click", addOther);
    document.getElementById("resetWeekBtn").addEventListener("click", resetCurrentWeek);
    document.getElementById("resetBtn").addEventListener("click", resetData);
    document.getElementById("saveCloudBtn").addEventListener("click", saveToCloud);
    document.getElementById("refreshCloudBtn").addEventListener("click", () => refreshFromCloud(false));
    document.querySelectorAll(".nav-button").forEach((node) => node.addEventListener("click", () => setTab(node.dataset.tab)));
    document.getElementById("modal").addEventListener("click", (event) => {
      if (event.target.dataset.close) {
        closeModal();
      }
    });

    window.addIngredient = addIngredient;
    window.updateIngredient = updateIngredient;
    window.moveIngredient = moveIngredient;
    window.removeIngredient = removeIngredient;
    window.renameMeal = renameMeal;
    window.updateMealImage = updateMealImage;
    window.deleteMeal = deleteMeal;
    window.updateOther = updateOther;
    window.deleteOther = deleteOther;

    applyFontScale();
    updateMealViewButton();
    updateColumnToggleButton();
    render();
    queueMealImages();
    enableTabSwipe();
    refreshFromCloud(true);
  </script>
</body>
</html>
