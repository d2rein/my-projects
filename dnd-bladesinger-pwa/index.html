<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DND - Alaric</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#09111a">
<style>
  :root{
    --bg:#070b10;
    --panel:#0f1722;
    --panel2:#141e2c;
    --line:#304158;
    --line2:#4b6b92;
    --text:#eef4ff;
    --muted:#98a9bf;
    --blue:#1d6ea5;
    --green:#1b7e53;
    --gold:#8a6820;
    --red:#872c2c;
    --yellow:#f0d246;
    --shadow:0 10px 28px rgba(0,0,0,.28);
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    background:
      radial-gradient(circle at top, rgba(41,103,155,.22), transparent 28%),
      linear-gradient(180deg, #09111a 0%, #06090e 100%);
  }
  button,input,select{font:inherit}
  button{cursor:pointer}
  .app{
    max-width:430px;
    margin:0 auto;
    min-height:100vh;
    padding:10px 10px 84px;
  }
  .page{display:none;gap:8px}
  .page.active{display:grid}
  .card{
    background:linear-gradient(180deg, rgba(18,27,38,.98), rgba(12,18,27,.98));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px;
    box-shadow:var(--shadow);
  }
  .section-title,.card-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
    font-size:13px;
    font-weight:800;
  }
  .title-actions{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .small-btn,.action-btn,.mode-btn,.mini-box,.chip,.slot-label,.slot-cell,.tag{
    border:1px solid var(--line2);
    border-radius:10px;
  }
  .small-btn,.action-btn,.mode-btn{
    background:#172537;
    color:#fff;
    padding:7px 9px;
    font-weight:700;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .small-btn{padding:5px 8px;font-size:12px}
  .action-btn.blue{background:#1b5d84}
  .action-btn.green{background:#166542}
  .action-btn.red{background:#7d2525}
  .action-btn.gold{background:#7c601b;color:#fff2c8}
  .action-btn.yellow{
    background:#ead04d;
    color:#1b1504;
    border-color:#f3e58b;
  }
  .tiny{font-size:11px}
  .tiny2{font-size:10px}
  .muted{color:var(--muted)}
  .top-card{
    display:grid;
    grid-template-columns:1fr auto;
    gap:8px;
    align-items:start;
  }
  .name{
    font-size:20px;
    font-weight:900;
    line-height:1;
  }
  .subtitle{
    margin-top:3px;
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .top-actions{
    display:grid;
    grid-template-columns:auto auto;
    gap:6px;
    align-items:start;
  }
  .coin-stack{
    display:grid;
    gap:4px;
  }
  .coin-box{
    min-width:96px;
    background:#0a1017;
    color:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:5px 7px;
    display:grid;
    grid-template-columns:auto auto;
    gap:2px 6px;
    font-size:10px;
  }
  .coin-box strong{text-align:right}
  .eq-box{
    background:#0a1017;
    color:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:4px 7px;
    text-align:center;
    font-size:10px;
    font-weight:800;
  }
  .chip-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
    margin-top:6px;
  }
  .chip{
    background:#101925;
    padding:5px 4px;
    text-align:center;
    font-size:10px;
    font-weight:800;
    position:relative;
    overflow:hidden;
  }
  .chip b{
    display:block;
    font-size:14px;
    color:#fff;
  }
  .chip.green{background:#113625}
  .chip.blue{background:#133d5b}
  .chip.gold{background:#4d3b13;color:#ffe7a8}
  .delta{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:13px;
    font-weight:900;
    pointer-events:none;
    animation:floatFade .9s ease forwards;
    text-shadow:0 1px 3px rgba(0,0,0,.7);
  }
  .delta.gain{color:#65f09c}
  .delta.loss{color:#ff7a7a}
  @keyframes floatFade{
    0%{opacity:0;transform:translate(-50%,0)}
    12%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-16px)}
  }
  .stats-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
  }
  .stat{
    background:#0d131c;
    border:1px solid var(--line);
    border-radius:10px;
    padding:5px 4px;
  }
  .stat-head{
    display:block;
    font-size:10px;
    font-weight:900;
    color:#cce4ff;
    text-align:left;
    padding-left:2px;
  }
  .stat-score{
    text-align:center;
    font-size:20px;
    font-weight:900;
    line-height:1;
    margin:3px 0 4px;
  }
  .stat-foot{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
    font-size:9px;
    font-weight:800;
  }
  .stat-pair{
    display:grid;
    gap:1px;
    justify-items:start;
  }
  .stat-pair:last-child{
    justify-items:end;
  }
  .stat-pair b{
    font-size:14px;
    line-height:1;
    color:#fff;
  }
  .stat-foot .save{color:#8fe0a8}
  .skills-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
  }
  .skill-col{
    background:#0d131c;
    border:1px solid var(--line);
    border-radius:10px;
    padding:4px;
  }
  .skill-col-title{
    text-align:center;
    font-size:10px;
    font-weight:900;
    color:#9cc6ea;
    margin-bottom:3px;
  }
  .skill-line{
    display:flex;
    justify-content:space-between;
    gap:6px;
    padding:3px 5px;
    border-radius:6px;
    background:#121c27;
    border:1px solid #33495d;
    font-size:9px;
    margin-bottom:3px;
    color:#fff;
    width:100%;
    min-width:0;
    appearance:none;
  }
  .skill-line span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
  .skill-line span:last-child{flex:none;white-space:nowrap}
  .skill-line:last-child{margin-bottom:0}
  .skill-line.prof{
    background:#183322;
    border:1px solid #2d734a;
  }
  .triple{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
  }
  .hitdice-card{
    display:grid;
    gap:5px;
  }
  .hitdice-row{
    display:grid;
    grid-template-columns:34px 1fr;
    gap:6px;
    align-items:center;
  }
  .hitdice-label{
    font-size:11px;
    font-weight:800;
    text-align:center;
  }
  .mini-box{
    background:#0d131c;
    padding:6px 5px;
    text-align:center;
  }
  .mini-box b{
    display:block;
    font-size:18px;
    margin-top:2px;
  }
  .resource-row{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:6px;
    align-items:stretch;
  }
  .resource-box{
    display:grid;
    gap:4px;
  }
  .resource-box .line{
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-size:12px;
    padding:4px 0;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .resource-box .line:first-child{border-top:0}
  .level-buttons{
    display:grid;
    gap:6px;
    min-width:92px;
  }
  .combat-top{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
  }
  .combat-chip{
    background:#0d131c;
    border:1px solid var(--line2);
    border-radius:10px;
    padding:5px 4px;
    text-align:center;
    font-size:10px;
    font-weight:800;
    position:relative;
    overflow:hidden;
  }
  .combat-chip b{
    display:block;
    font-size:14px;
  }
  .action-cluster{
    display:grid;
    grid-template-columns:1.2fr 82px 82px;
    grid-template-areas:
      "blade pips concheck"
      "rests mage adv"
      "spells shield active";
    gap:5px;
    margin-top:7px;
  }
  .cell-blade{grid-area:blade}
  .cell-pips{grid-area:pips}
  .cell-concheck{grid-area:concheck}
  .cell-rests{grid-area:rests}
  .cell-spells{grid-area:spells}
  .cell-mage{grid-area:mage}
  .cell-adv{grid-area:adv}
  .cell-active{grid-area:active}
  .cell-shield{grid-area:shield}
  .rest-pair{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
  }
  .spell-pair{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
  }
  .pips-box{
    background:#0c1118;
    border:1px solid var(--line);
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    min-height:34px;
  }
  .pip{
    width:10px;
    height:10px;
    border-radius:50%;
    border:1px solid #6786aa;
    background:#111822;
  }
  .pip.on{background:#2e88c4}
  .pip.green.on{
    background:#2aa85b;
    border-color:#88e2ac;
  }
  .amount-row{
    display:grid;
    grid-template-columns:1.3fr 1fr 1fr 1fr;
    gap:6px;
    margin-top:7px;
  }
  .amount-row input{
    width:100%;
  }
  .slot-panel{
    border:1px solid #ffffff;
    border-radius:12px;
    background:#06090d;
    padding:7px;
  }
  .slot-head{
    display:flex;
    justify-content:space-between;
    gap:6px;
    align-items:center;
    font-size:12px;
    font-weight:800;
    margin-bottom:5px;
  }
  .slot-grid{
    display:grid;
    gap:4px;
  }
  .slot-row{
    display:grid;
    grid-template-columns:repeat(9,1fr);
    gap:4px;
  }
  .slot-label{
    background:#111822;
    padding:4px 2px;
    text-align:center;
    font-size:10px;
    font-weight:800;
  }
  .slot-cell{
    min-height:28px;
    background:#0c1118;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:3px;
    padding:4px 2px;
  }
  .slot-cell .pip{
    width:9px;
    height:9px;
  }
  .combat-box{
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    background:#080d13;
  }
  .combat-title{
    padding:6px 8px;
    border-bottom:1px solid var(--line);
    font-size:12px;
    font-weight:800;
    background:#0d131b;
  }
  .combat-table{
    padding:5px;
    display:grid;
    gap:4px;
  }
  .combat-head,.row-grid{
    display:grid;
    grid-template-columns:22px 1fr 42px 42px 42px;
    gap:4px;
    align-items:center;
  }
  .combat-head div{
    background:#101821;
    border:1px solid var(--line);
    border-radius:6px;
    text-align:center;
    font-size:10px;
    padding:3px 2px;
  }
  .combat-head .head-main{
    grid-column:1 / span 2;
    text-align:left;
    padding-left:6px;
  }
  .combat-action{
    width:100%;
    border-radius:8px;
    border:1px solid #3b6d52;
    background:#165233;
    color:#fff;
    text-align:left;
    padding:4px 28px 4px 6px;
    min-height:34px;
    position:relative;
  }
  .combat-action.blue{
    background:#175c80;
    border-color:#468db4;
  }
  .combat-action b{
    display:block;
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .combat-action span{
    display:block;
    font-size:8px;
    color:#d6edf8;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .spell-corner{
    position:absolute;
    right:5px;
    top:4px;
    width:18px;
    height:18px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.45);
    background:rgba(6,10,16,.55);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:900;
    line-height:1;
  }
  .icon-btn,.mode-btn,.tag{
    min-height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:800;
    background:#101922;
    color:#fff;
  }
  .icon-btn{
    border:1px solid var(--line2);
    border-radius:7px;
    width:26px;
    padding:0 4px;
  }
  .mode-btn.active{background:#305f87}
  .mode-btn.warn{background:#77491f}
  .mode-btn.damaged{background:#674420}
  .tag{
    background:#0c131b;
  }
  .history{
    display:grid;
    gap:5px;
    max-height:146px;
    overflow:auto;
  }
  .history-line{
    background:#0d131b;
    border:1px solid rgba(255,255,255,.06);
    border-radius:9px;
    padding:6px 7px;
    font-size:11px;
    line-height:1.35;
  }
  .counts{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:6px;
  }
  .extra-inputs{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:6px;
    margin-top:8px;
    align-items:end;
  }
  .count-box{
    background:#0c1219;
    border:1px solid var(--line);
    border-radius:10px;
    padding:7px 8px;
    font-size:12px;
  }
  .count-box b{float:right}
  .book-section{
    background:#0a1017;
    border:1px solid var(--line);
    border-radius:12px;
    padding:7px;
  }
  .book-section + .book-section{margin-top:8px}
  .book-list{
    display:grid;
    gap:4px;
  }
  .book-row{
    display:grid;
    grid-template-columns:22px 1fr 42px 28px 22px;
    gap:4px;
    align-items:center;
    padding:4px;
    background:#121a23;
    border:1px solid var(--line);
    border-radius:9px;
  }
  .book-row.cantrip{background:#122334}
  .book-row.prepared{background:#153023}
  .badge{
    border:1px solid var(--line2);
    background:#0a1118;
    border-radius:6px;
    text-align:center;
    padding:4px 2px;
    font-size:10px;
    font-weight:800;
  }
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(2,6,10,.78);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:30;
    padding:10px;
  }
  .modal-backdrop.show{display:flex}
  .modal{
    width:min(430px,100%);
    max-height:90vh;
    overflow:auto;
    background:linear-gradient(180deg, #111a24, #0c1219);
    border:1px solid var(--line2);
    border-radius:18px;
    box-shadow:0 26px 70px rgba(0,0,0,.45);
    padding:12px;
  }
  .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .modal-title{
    font-size:16px;
    font-weight:900;
  }
  .form-grid{display:grid;gap:8px}
  .form-grid.two{grid-template-columns:1fr 1fr}
  label{
    display:grid;
    gap:4px;
    font-size:12px;
    font-weight:700;
    color:#dbe7f6;
  }
  input[type="number"],input[type="text"],select{
    width:100%;
    background:#0a1219;
    color:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 9px;
  }
  .check-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding:7px 8px;
    background:#0c1219;
    border:1px solid var(--line);
    border-radius:9px;
    font-size:12px;
  }
  .modal-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .modal-actions button{flex:1}
  .spell-card{
    background:#fff;
    color:#111;
    border:2px solid #111;
    border-radius:4px;
    overflow:hidden;
  }
  .spell-card-head{
    position:relative;
    min-height:28px;
    border-bottom:2px solid #111;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px 28px;
    font-family:Georgia,"Times New Roman",serif;
    font-weight:900;
  }
  .spell-level{
    position:absolute;
    right:5px;
    top:4px;
    width:19px;
    height:19px;
    border:2px solid #111;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:900;
  }
  .spell-meta{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border-bottom:2px solid #111;
  }
  .spell-meta > div{
    border-right:1px solid #111;
    padding:4px 3px;
    text-align:center;
  }
  .spell-meta > div:last-child{border-right:0}
  .spell-meta-label{
    font-size:7px;
    font-weight:900;
    text-transform:uppercase;
  }
  .spell-meta-value{
    font-size:9px;
    font-weight:800;
    margin-top:2px;
  }
  .spell-body{
    padding:8px;
    font-size:11px;
    line-height:1.28;
    white-space:pre-wrap;
  }
  .spell-foot{
    border-top:1px solid #111;
    padding:5px 7px;
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    font-size:10px;
  }
  .result-box{
    background:#0a1016;
    border:1px solid var(--line);
    border-radius:11px;
    padding:10px;
    line-height:1.4;
    font-size:12px;
    white-space:pre-wrap;
  }
  .spell-filter{
    display:grid;
    gap:7px;
  }
  .spell-filter-top{
    display:grid;
    grid-template-columns:1fr;
    gap:6px;
  }
  .spell-filter-row{
    display:grid;
    grid-template-columns:74px 1fr;
    gap:6px;
    align-items:center;
    font-size:12px;
    font-weight:800;
  }
  .level-filter{
    display:grid;
    grid-template-columns:36px 28px 28px 36px 28px 28px;
    gap:4px;
    align-items:center;
  }
  .level-filter input{
    text-align:center;
    padding:7px 4px;
  }
  .search-wrap{
    position:relative;
  }
  .search-wrap input{
    padding-right:34px;
  }
  .search-clear{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    width:24px;
    height:24px;
    border-radius:999px;
    border:1px solid var(--line2);
    background:#162231;
    color:#fff;
    font-weight:900;
    line-height:1;
    padding:0;
  }
  .footer-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:linear-gradient(180deg, rgba(11,17,24,.2), rgba(11,17,24,.96));
    backdrop-filter:blur(10px);
    padding:10px 12px 14px;
  }
  .tabs{
    max-width:430px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .tab{
    border:1px solid var(--line);
    background:#0e141c;
    color:var(--muted);
    border-radius:999px;
    padding:10px 8px;
    font-weight:800;
  }
  .tab.active{
    background:linear-gradient(180deg, #1d557f, #163c5f);
    border-color:#4f84b3;
    color:#fff;
  }
</style>
</head>
<body>
<div class="app">
  <section class="page active" data-page="stats">
    <div class="card">
      <div class="top-card">
        <div>
          <div class="name" id="charName">Alaric</div>
          <div class="subtitle" id="charSubtitle"></div>
        </div>
        <div class="top-actions">
          <button class="small-btn" id="editTopBtn">Edit</button>
          <div class="coin-stack">
            <button class="coin-box" id="coinsBtn" type="button"></button>
            <div class="eq-box" id="eqText"></div>
          </div>
        </div>
      </div>
      <div class="chip-grid" id="topChips"></div>
    </div>

    <div class="card">

  "Light": spell => castUtilitySpell(spell, "Object glows with bright light 20 ft and dim light 20 ft."),

let state = loadState();

function loadState(){
  try{
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    return ensureState(raw ? Object.assign(structuredClone(DEFAULT_STATE), raw) : structuredClone(DEFAULT_STATE));
  }catch{
    return ensureState(structuredClone(DEFAULT_STATE));
  }
}
function ensureState(raw){
  raw.knownSpells = unique(raw.knownSpells || DEFAULT_KNOWN);
  raw.preparedCantrips = unique((raw.preparedCantrips || DEFAULT_PREPARED_CANTRIPS).filter(name => spellLevel(name) === 0));
  raw.preparedSpells = unique((raw.preparedSpells || DEFAULT_PREPARED_SPELLS).filter(name => spellLevel(name) > 0));
  raw.proficientSkills = unique(raw.proficientSkills || []);
  raw.history = Array.isArray(raw.history) ? raw.history.slice(0, HISTORY_LIMIT) : [];
  raw.hpLog = Array.isArray(raw.hpLog) ? raw.hpLog.map((item, index) => Object.assign({ level:index + 2 }, item)) : [];
  raw.attackModes = Object.assign({}, DEFAULT_STATE.attackModes, raw.attackModes || {});
  raw.spellUpcast = raw.spellUpcast || {};
  raw.spellFilters = Object.assign({}, DEFAULT_STATE.spellFilters, raw.spellFilters || {});
  raw.dataVersion = Number(raw.dataVersion || 0);
  raw.slotCur = raw.slotCur || {};
  raw.hitDiceCur = Object.assign({}, DEFAULT_STATE.hitDiceCur, raw.hitDiceCur || {});
  if (raw.dataVersion < 1){
    if (!raw.knownSpells.includes("Toll the Dead")) raw.knownSpells.push("Toll the Dead");
    if (!raw.preparedCantrips.includes("Toll the Dead")) raw.preparedCantrips.push("Toll the Dead");
    raw.dataVersion = 1;
  }
  syncPreparedLists(raw);
  syncSlotsToLevel(raw);
  syncHitDice(raw);
  syncHp(raw);
  return raw;
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  render();
}
function unique(list){
  return Array.from(new Set(list.filter(Boolean)));
}
function pushHistory(line){
  const time = new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
  state.history.unshift(`${time}  ${line}`);
  state.history = state.history.slice(0, HISTORY_LIMIT);
  saveState();
}
function abilityMod(score){
  return Math.floor((score - 10) / 2);
}
function fmtMod(value){
  return value >= 0 ? `+${value}` : `${value}`;
}
function clamp(value, min, max){
  return Math.max(min, Math.min(max, value));
}
function getProgression(level = state.level){
  return { cleric: level >= 1 ? 1 : 0, wizard: Math.max(0, level - 1) };
}
function profBonus(){
  if (state.profOverride) return state.profOverride;
  if (state.level >= 17) return 6;
  if (state.level >= 13) return 5;
  if (state.level >= 9) return 4;
  if (state.level >= 5) return 3;
  return 2;
}
function spellAttackMod(){
  return abilityMod(state.abilityScores.INT) + profBonus();
}
function spellDc(){
  return 8 + abilityMod(state.abilityScores.INT) + profBonus();
}
function skillMod(name){
  const skill = SKILLS.find(item => item.name === name);
  if (!skill) return 0;
  return abilityMod(state.abilityScores[skill.abil]) + (state.proficientSkills.includes(name) ? profBonus() : 0);
}
function saveMod(abil){
  return abilityMod(state.abilityScores[abil]) + (SAVE_PROF[abil] ? profBonus() : 0);
}
function getBaseAc(){
  const dex = abilityMod(state.abilityScores.DEX);
  let base = state.customBaseAc === null || state.customBaseAc === "" ? 10 + dex : Number(state.customBaseAc) || 0;
  if (state.mageArmorActive) base = Math.max(base, 13 + dex);
  return base + Number(state.armourLongPressBonus || 0);
}
function currentAc(){
  let total = getBaseAc();
  if (state.bladesongActive) total += Math.max(1, abilityMod(state.abilityScores.INT));
  if (state.shieldActive) total += 5;
  if (state.hasteActive) total += 2;
  return total;
}
function currentInit(){
  return abilityMod(state.abilityScores.DEX) + Number(state.initBonus || 0);
}
function currentSpeed(){
  return Number(state.speed || 30) + (state.bladesongActive ? 10 : 0);
}
function bladesongUsesMax(){
  return profBonus();
}
function bladesongUsesRemaining(){
  return Math.max(0, bladesongUsesMax() - state.bladesongUsesSpent);
}
function maxHpFrom(target){
  const con = abilityMod(target.abilityScores.CON);
  const chosenTotal = target.hpLog
    .filter(item => !item.level || item.level <= target.level)
    .reduce((sum, item) => sum + Number(item.chosen || 0), 0);
  return Math.max(1, 8 + chosenTotal + (con * target.level));
}
function maxHp(){
  return maxHpFrom(state);
}
function syncHp(target){
  const max = maxHpFrom(target);
  target.hpCurrent = clamp(Number(target.hpCurrent || max), 0, max);
}
function syncSlotsToLevel(target){
  const slots = FULL_CASTER_SLOTS[target.level] || FULL_CASTER_SLOTS[20];
  for (let level = 1; level <= 9; level++){
    const max = slots[level - 1] || 0;
    const cur = Number(target.slotCur[level]);
    target.slotCur[level] = max === 0 ? 0 : Number.isFinite(cur) ? clamp(cur, 0, max) : max;
  }
}
function syncHitDice(target){
  const wizard = getProgression(target.level).wizard;
  const cleric = getProgression(target.level).cleric;
  const maxD6 = wizard;
  const maxD8 = cleric;
  if (target.hitDiceCur.d6 == null) target.hitDiceCur.d6 = maxD6;
  if (target.hitDiceCur.d8 == null) target.hitDiceCur.d8 = maxD8;
  target.hitDiceCur.d6 = clamp(target.hitDiceCur.d6, 0, maxD6);
  target.hitDiceCur.d8 = clamp(target.hitDiceCur.d8, 0, maxD8);
}
function syncPreparedLists(target){
  target.preparedCantrips = target.preparedCantrips.filter(name => target.knownSpells.includes(name) && spellLevel(name) === 0);
  target.preparedSpells = target.preparedSpells.filter(name => target.knownSpells.includes(name) && spellLevel(name) > 0);
}
function spellLevel(name){
  return Number(getSpellByName(name).level || 0);
}
function allSpellEntries(){
  const merged = new Map();
  (window.SPELL_DATA || []).forEach(spell => merged.set(spell.name, spell));
  EXTRA_SPELL_DATA.forEach(spell => {
    if (!merged.has(spell.name)) merged.set(spell.name, spell);
  });
  return Array.from(merged.values());
}
function getSpellByName(name){
  const spells = allSpellEntries();
  return spells.find(spell => spell.name === name) || {
    name, level:0, range:"-", components:"-", duration:"-", concentration:false,
    casting_time:"-", school:"-", classes:"-", description:"No spell card data available."
  };
}
function cantripKnownAllowance(){
  const wizard = getProgression().wizard;
  const cleric = getProgression().cleric;
  return (wizard >= 10 ? 5 : wizard >= 4 ? 4 : wizard >= 1 ? 3 : 0) + (cleric ? 3 : 0) + Number(state.extraCantrips || 0);
}
function spellbookAllowance(){
  const wizard = getProgression().wizard;
  const base = wizard > 0 ? 6 + Math.max(0, wizard - 1) * 2 : 0;
  return base + Number(state.extraSpellbook || 0);
}
function preparedLimit(){
  const prog = getProgression();
  return Math.max(0, prog.wizard + abilityMod(state.abilityScores.INT)) + Math.max(0, prog.cleric + abilityMod(state.abilityScores.WIS));
}
function wizardRecoveryLimit(){
  return Math.ceil(getProgression().wizard / 2);
}
function getUpcastLevel(name){
  return Number(state.spellUpcast[name] || 0);
}
function displaySpellLevel(spell){
  const base = Number(spell.level || 0);
  return base === 0 ? "0" : String(spellCastLevel(spell));
}
function spellCastLevel(spell){
  return Number(spell.level || 0) + getUpcastLevel(spell.name);
}
function shadowBladeDice(name){
  const castLevel = 2 + getUpcastLevel(name);
  if (castLevel >= 5) return "4d8";
  if (castLevel >= 3) return "3d8";
  return "2d8";
}
function scaleCantrip(base){
  const [count, die] = base.split("d").map(Number);
  let mult = 1;
  if (state.level >= 17) mult = 4;
  else if (state.level >= 11) mult = 3;
  else if (state.level >= 5) mult = 2;
  return `${count * mult}d${die}`;
}
function rollDie(size){
  return Math.floor(Math.random() * size) + 1;
}
function rollSpec(spec){
  const [countStr, dieStr] = spec.toLowerCase().split("d");
  const count = Number(countStr);
  const die = Number(dieStr);
  const rolls = Array.from({ length: count }, () => rollDie(die));
  return { rolls, total: rolls.reduce((sum, roll) => sum + roll, 0), max: count * die };
}
function parseDiceSpec(spec){
  const match = String(spec || "").toLowerCase().match(/(\d+)d(\d+)/);
  if (!match) return null;
  return { count:Number(match[1]), die:Number(match[2]) };
}
function addDiceSpecs(baseSpec, extraSpec, times){
  const base = parseDiceSpec(baseSpec);
  const extra = parseDiceSpec(extraSpec);
  if (!base || !extra || !times) return baseSpec;
  if (base.die !== extra.die) return `${base.count + (extra.count * times)}d${base.die}`;
  return `${base.count + (extra.count * times)}d${base.die}`;
}
function formatRollBreakdown(prefix, rolls, modifier = 0, extra = ""){
  let line = prefix;
  if (modifier){
    line += modifier >= 0 ? `+${modifier}` : `${modifier}`;
  }
  line += ` - ${rolls.join(" + ")}`;
  if (modifier){
    line += modifier >= 0 ? ` + ${modifier}` : ` - ${Math.abs(modifier)}`;
  }
  if (extra) line += ` + ${extra}`;
  return line;
}
function titleCase(value){
  return String(value || "").replace(/\b[a-z]/g, char => char.toUpperCase());
}
function inferSpellAction(spell){
  const description = String(spell.description || "");
  if (!description) return null;
  if (/make a (ranged|melee) spell attack/i.test(description)){
    const damageMatch = description.match(/takes? (\d+d\d+) ([A-Za-z]+) damage/i);
    if (!damageMatch) return null;
    const upcastMatch = description.match(/damage increases by (\d+d\d+) for each spell slot level above (\d+)/i);
    let diceSpec = Number(spell.level || 0) === 0 ? scaleCantrip(damageMatch[1]) : damageMatch[1];
    if (upcastMatch){
      const step = Math.max(0, spellCastLevel(spell) - Number(upcastMatch[2]));
      diceSpec = addDiceSpecs(diceSpec, upcastMatch[1], step);
    }
    return () => castAttackSpell(spell, diceSpec, damageMatch[2].toLowerCase());
  }
  const saveMatch = description.match(/must succeed on a ([A-Za-z]+) saving throw/i);
  const saveDamageMatch = description.match(/take(?:s)? (\d+d\d+) ([A-Za-z]+) damage/i);
  if (saveMatch && saveDamageMatch){
    const upcastMatch = description.match(/damage increases by (\d+d\d+) for each spell slot level above (\d+)/i);
    let diceSpec = Number(spell.level || 0) === 0 ? scaleCantrip(saveDamageMatch[1]) : saveDamageMatch[1];
    if (upcastMatch){
      const step = Math.max(0, spellCastLevel(spell) - Number(upcastMatch[2]));
      diceSpec = addDiceSpecs(diceSpec, upcastMatch[1], step);
    }
    const note = `${titleCase(saveMatch[1])} save${/half as much damage on a successful/i.test(description) ? ", half on success." : "."}`;
    return () => castSaveSpell(spell, diceSpec, saveDamageMatch[2].toLowerCase(), note);
  }
  return null;
}
function rollD20(mode){
  const first = rollDie(20);
  if (mode === "adv" || mode === "dis"){
    const second = rollDie(20);
    return {
      chosen: mode === "adv" ? Math.max(first, second) : Math.min(first, second),
      text: `${mode === "adv" ? "max" : "min"}(${first}, ${second})`
    };
  }
  return { chosen:first, text:`${first}` };
}
function nextMode(mode){
  if (mode === "-") return "adv";
  if (mode === "adv") return "dis";
  return "-";
}
function spendSlot(level){
  if (!level) return true;
  if ((state.slotCur[level] || 0) <= 0){
    openResult("No Slot Available", `No level ${level} spell slots remain.`);
    pushHistory(`No L${level} spell slots remaining.`);
    return false;
  }
  state.slotCur[level] -= 1;
  return true;
}
function restoreSlot(level){
  const max = (FULL_CASTER_SLOTS[state.level] || [])[level - 1] || 0;
  state.slotCur[level] = clamp((state.slotCur[level] || 0) + 1, 0, max);
}

  node.textContent = text;

function applyAmountAction(type){
  const input = document.getElementById("amountInput");
  const amount = Math.max(0, Number(input.value) || 0);
  input.value = "";
  if (!amount) return;
  if (type === "damage"){
    let remaining = amount;
    const absorbed = Math.min(state.thp, remaining);
    if (absorbed){
      state.thp -= absorbed;
      remaining -= absorbed;
      flashDelta("thpChip", `-${absorbed}`, "loss");
    }
    if (remaining){
      state.hpCurrent = clamp(state.hpCurrent - remaining, 0, maxHp());
    }
    saveState();
    if (absorbed) flashDelta("thpChip", `-${absorbed}`, "loss");
    if (remaining) flashDelta("hpChip", `-${remaining}`, "loss");
    pushHistory(`Damage: -${absorbed} THP, -${remaining} HP -> ${state.hpCurrent}/${maxHp()} HP, ${state.thp} THP`);
    if (state.concentrationActive){
      runConcentrationCheck();
    }
    return;
  }
  if (type === "heal"){
    const before = state.hpCurrent;
    state.hpCurrent = clamp(state.hpCurrent + amount, 0, maxHp());
    const gain = state.hpCurrent - before;
    saveState();
    if (gain) flashDelta("hpChip", `+${gain}`, "gain");
    pushHistory(`Heal: +${gain} HP -> ${state.hpCurrent}/${maxHp()}`);
    return;
  }
  if (type === "thp"){
    const before = state.thp;
    state.thp = Math.max(state.thp, amount);
    const gain = state.thp - before;
    saveState();
    if (gain) flashDelta("thpChip", `+${gain}`, "gain");
    pushHistory(`THP: now ${state.thp}`);
  }
}

function spendHitDie(type, event){
  if (event) event.stopPropagation();
  const remaining = Number(state.hitDiceCur[type] || 0);
  if (remaining <= 0){
    openResult("Hit Dice", `No ${type} hit dice remaining.`);
    return;
  }
  const die = type === "d8" ? 8 : 6;
  const healRoll = rollSpec(`1d${die}`);
  const con = abilityMod(state.abilityScores.CON);
  const rawTotal = healRoll.total + con;
  const before = state.hpCurrent;
  state.hitDiceCur[type] = remaining - 1;
  state.hpCurrent = clamp(state.hpCurrent + Math.max(0, rawTotal), 0, maxHp());
  const gain = state.hpCurrent - before;
  openResult("Hit Dice", `1d${die}${con >= 0 ? "+" : ""}${con} - ${healRoll.rolls.join(" + ")}${con >= 0 ? "+" : ""}${con} = ${rawTotal}\nRecovered ${gain} HP`);

  pushHistory(`Hit Die ${type}: healed ${gain} HP.`);

  if (baseLevel > 0 && !spendSlot(castLevel)) return saveState();
  setConcentrationFromSpell(spell);
  const text = `${spell.casting_time || "Action"} / ${spell.range || "-"}\n${spell.description || "Spell cast."}`;

function longRest(){

  state.minorElementalsActive = false;

  const slots = FULL_CASTER_SLOTS[state.level] || FULL_CASTER_SLOTS[20];
  for (let level = 1; level <= 9; level++){
    state.slotCur[level] = slots[level - 1] || 0;
  }
  const totalHitDice = getProgression().wizard + getProgression().cleric;
  let recover = Math.max(1, Math.floor(totalHitDice / 2));
  const maxD6 = getProgression().wizard;
  const maxD8 = getProgression().cleric;
  const needD6 = maxD6 - state.hitDiceCur.d6;
  const addD6 = Math.min(needD6, recover);
  state.hitDiceCur.d6 += addD6;
  recover -= addD6;
  const needD8 = maxD8 - state.hitDiceCur.d8;
  const addD8 = Math.min(needD8, recover);

  saveState();

function openArcaneRecovery(){

  const rows = [];

    const max = (FULL_CASTER_SLOTS[state.level] || [])[level - 1] || 0;
    rows.push(`
      <label class="check-item">
        <span>Level ${level} (${state.slotCur[level] || 0}/${max})</span>
        <input type="number" min="0" max="${Math.max(0, max - (state.slotCur[level] || 0))}" value="0" data-recover="${level}" ${disabled ? "disabled" : ""}>
      </label>
    `);
  }
  openModal(`
    <div class="modal-head">
      <div class="modal-title">Arcane Recovery</div>
      <button class="small-btn" data-close>Close</button>
    </div>
    <div class="result-box">Once per day after a short rest, recover spell slots with a combined level up to ${available}. No slot can be 6th level or higher.</div>
    <div class="form-grid" style="margin-top:10px;">${rows.join("")}</div>
    <div class="modal-actions">
      <button class="action-btn blue" id="recoverSlotsBtn" ${disabled ? "disabled" : ""}>Recover Slots</button>
    </div>
  `);
  const button = document.getElementById("recoverSlotsBtn");
  if (!button) return;
  button.onclick = () => {
    const picks = Array.from(document.querySelectorAll("[data-recover]")).map(input => ({
      level:Number(input.dataset.recover),
      amount:Math.max(0, Number(input.value) || 0)
    }));
    const cost = picks.reduce((sum, pick) => sum + pick.level * pick.amount, 0);
    if (cost > available){
      openResult("Arcane Recovery", `That selection costs ${cost}, but your maximum is ${available}.`);
      return;
    }
    picks.forEach(pick => {
      for (let i = 0; i < pick.amount; i++) restoreSlot(pick.level);
    });
    if (cost > 0) state.arcaneRecoveryUsed = true;
    pushHistory(cost > 0 ? `Arcane Recovery: restored slots costing ${cost}.` : "Arcane Recovery opened with no slots recovered.");
    closeModal();
    saveState();
  };
}
function levelUp(){
  if (state.level >= 20){
    openResult("Level Up", "This build is capped at level 20.");
    return;
  }
  const nextLevel = state.level + 1;
  const wizardLevel = getProgression(nextLevel).wizard;
  const existing = state.hpLog.find(item => item.level === nextLevel);
  const roll = existing ? existing.roll : rollDie(6);
  const chosen = existing ? existing.chosen : Math.max(roll, 4);
  const gain = chosen + abilityMod(state.abilityScores.CON);
  openModal(`
    <div class="modal-head">
      <div class="modal-title">Level Up to ${nextLevel}</div>
      <button class="small-btn" data-close>Close</button>
    </div>
    <div class="result-box">Wizard level ${wizardLevel}\nRolled d6: ${roll}\nUsed: ${chosen}\nCON mod: ${fmtMod(abilityMod(state.abilityScores.CON))}\nHP gain: ${gain}${existing ? `\nLocked roll from your first time reaching this level.` : ""}</div>
    <div class="modal-actions">
      <button class="action-btn green" id="confirmLevelBtn">Apply Level Up</button>
    </div>
  `);
  document.getElementById("confirmLevelBtn").onclick = () => {
    state.level = nextLevel;
    if (!existing){
      state.hpLog.push({ level:nextLevel, class:"wizard", roll, chosen, gain });
      state.hitDiceCur.d6 = (state.hitDiceCur.d6 || 0) + 1;
    }
    syncSlotsToLevel(state);
    state.hpCurrent = Math.min(maxHp(), state.hpCurrent + gain);
    pushHistory(`Level up: Wizard ${wizardLevel}. d6 rolled ${roll}, used ${chosen}, gained ${gain} HP.`);
    closeModal();
    saveState();
  };
}
function levelDown(){
  const available = [1].concat(state.hpLog.map(item => item.level))
    .filter((value, index, list) => list.indexOf(value) === index)
    .sort((a,b) => b - a);
  if (available.length === 0){
    openResult("Previous Level", "No previous wizard level to roll back to.");
    return;
  }
  openModal(`
    <div class="modal-head">
      <div class="modal-title">Previous Level</div>
      <button class="small-btn" data-close>Close</button>
    </div>
    <div class="form-grid">
      ${available.map(level => `<button class="action-btn blue" data-level-pick="${level}">Level ${level}</button>`).join("")}
    </div>
  `);
  document.querySelectorAll("[data-level-pick]").forEach(button => {
    button.onclick = () => {
      const targetLevel = Number(button.dataset.levelPick);
      state.level = targetLevel;

      if (state.bladesongUsesSpent > bladesongUsesMax()){

      </div>

      <div class="spell-foot"><span>${escapeHtml(spell.school || "-")}</span><span>${escapeHtml(spell.classes || "-")}</span></div>
    </div>
    <div class="modal-actions">
      <button class="action-btn blue" id="castFromCardBtn">Cast</button>
    </div>
  `);
  if (restoreKnownEditor){
    document.querySelectorAll("[data-close]").forEach(button => button.onclick = restoreKnownEditor);
    document.getElementById("modalBack").onclick = event => {
      if (event.target === document.getElementById("modalBack")) restoreKnownEditor();
    };
    document.getElementById("castFromCardBtn").onclick = () => {
      castSpellByName(name);
      restoreKnownEditor();
    };
    return;
  }
  document.getElementById("castFromCardBtn").onclick = () => castSpellByName(name);
}
function openCoinsEditor(){
  openPrompt({
    title:"Coins",
    fields:[
      { name:"cp", label:"Copper", type:"number", value:state.coins.cp },
      { name:"sp", label:"Silver", type:"number", value:state.coins.sp },
      { name:"gp", label:"Gold", type:"number", value:state.coins.gp },
      { name:"convert", label:"Convert", type:"select", value:"none", options:[
        { value:"none", label:"No conversion" },
        { value:"cp-sp", label:"CP to SP" },
        { value:"sp-gp", label:"SP to GP" }
      ]}
    ],
    onSubmit(values){
      state.coins.cp = Math.max(0, Number(values.cp) || 0);
      state.coins.sp = Math.max(0, Number(values.sp) || 0);
      state.coins.gp = Math.max(0, Number(values.gp) || 0);
      if (values.convert === "cp-sp"){
        const count = Math.floor(state.coins.cp / 10);
        state.coins.cp -= count * 10;
        state.coins.sp += count;
      }
      if (values.convert === "sp-gp"){
        const count = Math.floor(state.coins.sp / 10);
        state.coins.sp -= count * 10;
        state.coins.gp += count;
      }
      pushHistory(`Coins updated: ${state.coins.cp} cp, ${state.coins.sp} sp, ${state.coins.gp} gp.`);
      saveState();
    }
  });
}
function openTopEditor(){
  openPrompt({
    title:"Edit Top Box",
    fields:[
      { name:"name", label:"Name", type:"text", value:state.name },
      { name:"hpCurrent", label:"Current HP", type:"number", value:state.hpCurrent },
      { name:"baseAc", label:"Base AC", type:"number", value:state.customBaseAc == null ? getBaseAc() : state.customBaseAc },
      { name:"initBonus", label:"Init Bonus", type:"number", value:state.initBonus },
      { name:"speed", label:"Speed", type:"number", value:state.speed },
      { name:"prof", label:"Proficiency Bonus", type:"number", value:profBonus() }
    ],
    onSubmit(values){
      state.name = values.name || "Alaric";
      state.hpCurrent = clamp(Number(values.hpCurrent) || maxHp(), 0, maxHp());
      state.customBaseAc = values.baseAc === "" ? null : Number(values.baseAc) || 0;
      state.initBonus = Number(values.initBonus) || 0;
      state.speed = Number(values.speed) || 30;
      state.profOverride = Number(values.prof) || null;
      saveState();
    }
  });
}
function openAbilitiesEditor(){
  openPrompt({
    title:"Edit Core Stats",
    fields:ABILITIES.map(abil => ({ name:abil, label:ABILITY_LABELS[abil], type:"number", value:state.abilityScores[abil] })),
    onSubmit(values){
      const oldCon = abilityMod(state.abilityScores.CON);
      ABILITIES.forEach(abil => state.abilityScores[abil] = Number(values[abil]) || 10);
      const newCon = abilityMod(state.abilityScores.CON);
      const conDelta = newCon - oldCon;
      if (conDelta !== 0){
        state.hpCurrent = clamp(state.hpCurrent + (conDelta * state.level), 0, maxHpFrom(state));
      }
      syncHp(state);
      saveState();
    }
  });
}

function openUpcastPicker(name){
  const spell = getSpellByName(name);
  const base = Number(spell.level || 0);
  if (!base) return;
  const maxUpcast = 9 - base;
  const options = Array.from({ length: maxUpcast + 1 }, (_, idx) => `<button class="action-btn ${getUpcastLevel(name) === idx ? "blue" : ""}" data-upcast-choice="${idx}">+${idx}</button>`).join("");
  openModal(`
    <div class="modal-head">
      <div class="modal-title">Upcast ${escapeHtml(name)}</div>
      <button class="small-btn" data-close>Close</button>
    </div>
    <div class="form-grid">${options}</div>
  `);
  document.querySelectorAll("[data-upcast-choice]").forEach(button => {
    button.onclick = () => {
      state.spellUpcast[name] = Number(button.dataset.upcastChoice);
      closeModal();
      saveState();
    };
  });
}
function openKnownEditor(){
  renderKnownEditorModal();
}
function bindKnownEditorHandlers(){
  const rows = Array.from(document.querySelectorAll("[data-spell-row]"));
  const search = document.getElementById("spellSearch");
  const clear = document.getElementById("spellSearchClear");
  const classFilter = document.getElementById("spellClassFilter");
  const sort = document.getElementById("spellSort");
  const minLevel = document.getElementById("minLevel");
  const maxLevel = document.getElementById("maxLevel");
  const grid = document.getElementById("knownSpellGrid");
  const applyFilters = () => {
    state.spellFilters.search = search.value || "";
    state.spellFilters.class = classFilter.value;
    state.spellFilters.sort = sort.value;
    state.spellFilters.minLevel = clamp(Number(minLevel.value) || 0, 0, 9);
    state.spellFilters.maxLevel = clamp(Number(maxLevel.value) || 9, 0, 9);
    const query = state.spellFilters.search.trim().toLowerCase();
    const selectedClass = state.spellFilters.class;
    const low = Math.min(state.spellFilters.minLevel, state.spellFilters.maxLevel);
    const high = Math.max(state.spellFilters.minLevel, state.spellFilters.maxLevel);
    rows.forEach(row => {
      const level = Number(row.dataset.level);
      const classes = row.dataset.classes || "";
      const text = row.dataset.search || "";
      const matchesClass = selectedClass === "all" || classes.includes(selectedClass);
      const matchesSearch = !query || text.includes(query);
      const matchesLevel = level >= low && level <= high;
      row.style.display = matchesClass && matchesSearch && matchesLevel ? "" : "none";
    });
    const visible = rows.filter(row => row.style.display !== "none");
    visible.sort((a, b) => {
      if (state.spellFilters.sort === "az"){
        return a.dataset.name.localeCompare(b.dataset.name);
      }
      return Number(a.dataset.level) - Number(b.dataset.level) || a.dataset.name.localeCompare(b.dataset.name);
    }).forEach(row => grid.appendChild(row));
  };
  search.oninput = applyFilters;
  clear.onclick = () => {
    search.value = "";
    applyFilters();
    search.focus();
  };
  classFilter.onchange = applyFilters;
  sort.onchange = applyFilters;
  minLevel.oninput = applyFilters;
  maxLevel.oninput = applyFilters;
  document.getElementById("minMinus").onclick = () => { minLevel.value = clamp((Number(minLevel.value) || 0) - 1, 0, 9); applyFilters(); };
  document.getElementById("minPlus").onclick = () => { minLevel.value = clamp((Number(minLevel.value) || 0) + 1, 0, 9); applyFilters(); };
  document.getElementById("maxMinus").onclick = () => { maxLevel.value = clamp((Number(maxLevel.value) || 9) - 1, 0, 9); applyFilters(); };
  document.getElementById("maxPlus").onclick = () => { maxLevel.value = clamp((Number(maxLevel.value) || 9) + 1, 0, 9); applyFilters(); };
  document.querySelectorAll("[data-spell-info]").forEach(button => button.onclick = () => {
    const modal = document.getElementById("modal");
    const previousScroll = modal.scrollTop;
    const restore = () => {
      renderKnownEditorModal();
      requestAnimationFrame(() => {
        const restoredModal = document.getElementById("modal");
        const restoredSearch = document.getElementById("spellSearch");
        restoredModal.scrollTop = previousScroll;
        restoredSearch.focus();
        restoredSearch.setSelectionRange(restoredSearch.value.length, restoredSearch.value.length);
      });
    };
    openSpellCard(button.dataset.spellInfo, restore);
  });
  applyFilters();
}
function renderKnownEditorModal(){
  const spells = allSpellEntries().slice().sort((a,b) => Number(a.level) - Number(b.level) || a.name.localeCompare(b.name));
  const rows = spells.map(spell => `
    <div class="check-item" data-spell-row data-name="${escapeAttr(spell.name)}" data-level="${spell.level}" data-classes="${escapeAttr((spell.classes || "").toLowerCase())}" data-search="${escapeAttr(`${spell.name} ${spell.school || ""} ${spell.classes || ""}`.toLowerCase())}">
      <button class="icon-btn" data-spell-info="${escapeAttr(spell.name)}">i</button>
      <div style="flex:1;min-width:0;">
        <div>${escapeHtml(spell.name)}</div>
        <div class="tiny muted">L${spell.level} / ${escapeHtml(spell.school || "-")} / ${escapeHtml(spell.classes || "-")}</div>
      </div>
      <input type="checkbox" data-known-box="${escapeAttr(spell.name)}" ${state.knownSpells.includes(spell.name) ? "checked" : ""}>
    </div>
  `).join("");
  openModal(`
    <div class="modal-head">
      <div class="modal-title">Edit Spells</div>
      <button class="small-btn" data-close>Close</button>
    </div>
    <div class="spell-filter">
      <div class="spell-filter-top">
        <div class="search-wrap">
          <input type="text" id="spellSearch" placeholder="Search" value="${escapeAttr(state.spellFilters.search)}">
          <button class="search-clear" id="spellSearchClear">X</button>
        </div>
      </div>
      <div class="spell-filter-row">
        <span>CLASS:</span>
        <select id="spellClassFilter">
          <option value="all" ${state.spellFilters.class === "all" ? "selected" : ""}>All Classes</option>
          <option value="bard" ${state.spellFilters.class === "bard" ? "selected" : ""}>Bard</option>
          <option value="wizard" ${state.spellFilters.class === "wizard" ? "selected" : ""}>Wizard</option>
          <option value="cleric" ${state.spellFilters.class === "cleric" ? "selected" : ""}>Cleric</option>
          <option value="druid" ${state.spellFilters.class === "druid" ? "selected" : ""}>Druid</option>
          <option value="paladin" ${state.spellFilters.class === "paladin" ? "selected" : ""}>Paladin</option>
          <option value="ranger" ${state.spellFilters.class === "ranger" ? "selected" : ""}>Ranger</option>
          <option value="sorcerer" ${state.spellFilters.class === "sorcerer" ? "selected" : ""}>Sorcerer</option>
          <option value="warlock" ${state.spellFilters.class === "warlock" ? "selected" : ""}>Warlock</option>
          <option value="artificer" ${state.spellFilters.class === "artificer" ? "selected" : ""}>Artificer</option>
        </select>
      </div>
      <div class="spell-filter-row">
        <span>LEVEL:</span>
        <div class="level-filter">
          <input id="minLevel" type="number" min="0" max="9" value="${state.spellFilters.minLevel}">
          <button class="small-btn" id="minMinus">-</button>
          <button class="small-btn" id="minPlus">+</button>
          <input id="maxLevel" type="number" min="0" max="9" value="${state.spellFilters.maxLevel}">
          <button class="small-btn" id="maxMinus">-</button>
          <button class="small-btn" id="maxPlus">+</button>
        </div>
      </div>
      <div class="spell-filter-row">
        <span>SORT:</span>
        <select id="spellSort">
          <option value="level" ${state.spellFilters.sort === "level" ? "selected" : ""}>Level</option>
          <option value="az" ${state.spellFilters.sort === "az" ? "selected" : ""}>A-Z</option>
        </select>
      </div>
    </div>
    <div class="form-grid" id="knownSpellGrid" style="margin-top:8px;">${rows}</div>
    <div class="modal-actions">
      <button class="action-btn blue" id="saveKnownBtn">Save Spells</button>
    </div>
  `);
  bindKnownEditorHandlers();
  document.getElementById("saveKnownBtn").onclick = () => {
    state.knownSpells = Array.from(document.querySelectorAll("[data-known-box]:checked")).map(box => box.dataset.knownBox);
    syncPreparedLists(state);
    closeModal();
    saveState();
  };
}
function filteredSpells(){
  const spells = allSpellEntries().slice();
  const query = state.spellFilters.search.trim().toLowerCase();
  const selectedClass = state.spellFilters.class;
  const minLevel = Math.min(state.spellFilters.minLevel, state.spellFilters.maxLevel);
  const maxLevel = Math.max(state.spellFilters.minLevel, state.spellFilters.maxLevel);
  let filtered = spells.filter(spell => {
    const text = `${spell.name} ${spell.school} ${spell.classes}`.toLowerCase();
    if (query && !text.includes(query)) return false;
    if (selectedClass !== "all" && !(spell.classes || "").toLowerCase().includes(selectedClass)) return false;
    const level = Number(spell.level || 0);
    return level >= minLevel && level <= maxLevel;
  });
  filtered.sort((a,b) => {
    if (state.spellFilters.sort === "az") return a.name.localeCompare(b.name);
    return Number(a.level) - Number(b.level) || a.name.localeCompare(b.name);
  });
  return filtered;
}
function shortSkill(name){
  return name
    .replace("Sleight of Hand","Sleight")
    .replace("Animal Handling","Animal")
    .replace("Investigation","Investig.")
    .replace("Perception","Percept.")
    .replace("Performance","Perform.")
    .replace("Persuasion","Persuade")
    .replace("Intimidation","Intimid.")
    .replace("Acrobatics","Acrobat.")
    .replace("Athletics","Athletics");
}
function openModal(html){
  const back = document.getElementById("modalBack");
  document.getElementById("modal").innerHTML = html;
  back.classList.add("show");
  document.querySelectorAll("[data-close]").forEach(button => button.onclick = closeModal);
  back.onclick = event => {
    if (event.target === back) closeModal();
  };
}
function closeModal(){
  document.getElementById("modalBack").classList.remove("show");
}
function openResult(title, text){
  openModal(`
    <div class="modal-head">
      <div class="modal-title">${escapeHtml(title)}</div>
      <button class="small-btn" data-close>Close</button>
    </div>
    <div class="result-box">${escapeHtml(text)}</div>
  `);
}
function openPrompt({ title, fields, onSubmit }){
  const body = fields.map(field => {
    if (field.type === "select"){
      return `
        <label>${escapeHtml(field.label)}
          <select name="${escapeAttr(field.name)}">
            ${field.options.map(option => `<option value="${escapeAttr(option.value)}" ${option.value === field.value ? "selected" : ""}>${escapeHtml(option.label)}</option>`).join("")}
          </select>
        </label>
      `;
    }
    return `
      <label>${escapeHtml(field.label)}
        <input type="${field.type}" name="${escapeAttr(field.name)}" value="${escapeAttr(String(field.value ?? ""))}" ${field.min != null ? `min="${field.min}"` : ""} ${field.max != null ? `max="${field.max}"` : ""}>
      </label>
    `;
  }).join("");
  openModal(`
    <div class="modal-head">
      <div class="modal-title">${escapeHtml(title)}</div>
      <button class="small-btn" data-close>Close</button>
    </div>
    <div class="form-grid">${body}</div>
    <div class="modal-actions">
      <button class="action-btn blue" id="promptSaveBtn">Save</button>
    </div>
  `);
  document.getElementById("promptSaveBtn").onclick = () => {
    const values = {};
    fields.forEach(field => {
      const element = document.querySelector(`[name="${field.name}"]`);
      values[field.name] = element.value;
    });
    closeModal();
    onSubmit(values);
  };
}
function escapeHtml(value){
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function escapeAttr(value){
  return escapeHtml(value).replace(/'/g, "&#39;");
}

render();
if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
