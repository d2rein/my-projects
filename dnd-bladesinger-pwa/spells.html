<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alaric Spell Cards</title>
<style>
  :root{
    --bg:#080d13;
    --panel:#131b26;
    --panel-2:#0f1620;
    --line:#2e4158;
    --line-2:#4f6f93;
    --text:#eef4ff;
    --muted:#95a8bf;
    --accent:#1fd178;
    --accent-2:#19a35f;
    --chip:#182434;
    --shadow:0 16px 36px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    background:
      radial-gradient(circle at top left, rgba(41,103,155,.18), transparent 28%),
      linear-gradient(180deg, #0a1119 0%, #06090d 100%);
  }
  a{color:inherit}
  button,input,select{font:inherit}
  button{cursor:pointer}
  .shell{
    min-height:100vh;
    display:grid;
    grid-template-rows:auto 1fr;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    background:rgba(10,15,22,.92);
    backdrop-filter:blur(10px);
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    min-width:0;
  }
  .brand b{
    color:var(--accent);
    font-size:20px;
    font-weight:900;
    letter-spacing:.02em;
  }
  .brand span{
    color:var(--muted);
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .top-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }
  .btn,.mini-btn{
    border:1px solid var(--line-2);
    background:#162231;
    color:#fff;
    border-radius:10px;
    padding:8px 12px;
    font-weight:800;
  }
  .btn.accent{
    background:linear-gradient(180deg, var(--accent), var(--accent-2));
    color:#062012;
    border-color:#62efab;
  }
  .mini-btn{
    padding:7px 9px;
    min-width:34px;
  }
  .layout{
    display:grid;
    grid-template-columns:290px 1fr;
    min-height:0;
  }
  .sidebar{
    border-right:1px solid var(--line);
    background:rgba(17,24,35,.92);
    padding:14px;
    overflow:auto;
  }
  .main{
    min-width:0;
    padding:14px;
    overflow:auto;
  }
  .panel{
    background:linear-gradient(180deg, rgba(18,26,38,.98), rgba(12,18,27,.98));
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
  }
  .filter-panel{
    padding:12px;
    display:grid;
    gap:10px;
  }
  .panel-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    font-size:13px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  .panel-title .muted{
    text-transform:none;
    letter-spacing:0;
  }
  .muted{color:var(--muted)}
  .filter-row{
    display:grid;
    grid-template-columns:70px 1fr;
    gap:8px;
    align-items:center;
    font-size:12px;
    font-weight:800;
  }
  .filter-row label{
    color:#d6e8ff;
  }
  .filter-row input,
  .filter-row select{
    width:100%;
    background:#0c141d;
    color:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 9px;
  }
  .level-range{
    display:grid;
    grid-template-columns:1fr 30px 30px 1fr 30px 30px;
    gap:4px;
    align-items:center;
  }
  .level-range input{
    text-align:center;
    padding:8px 4px;
  }
  .search-wrap{
    position:relative;
  }
  .search-wrap input{
    padding-right:34px;
  }
  .search-clear{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    width:24px;
    height:24px;
    border-radius:999px;
    border:1px solid var(--line-2);
    background:#172537;
    color:#fff;
    font-weight:900;
    line-height:1;
    padding:0;
  }
  .action-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .spell-list{
    margin-top:12px;
    border-top:1px solid var(--line);
    padding-top:12px;
    display:grid;
    gap:6px;
  }
  .spell-list-scroll{
    max-height:calc(100vh - 360px);
    overflow:auto;
    padding-right:2px;
  }
  .spell-option{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:8px;
    align-items:center;
    background:#0d141d;
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px;
  }
  .spell-option.selected{
    background:#13273a;
    border-color:#5aa1d0;
  }
  .spell-option input{
    width:18px;
    height:18px;
    margin:0;
    accent-color:var(--accent);
  }
  .spell-option-main{
    min-width:0;
  }
  .spell-option-main b{
    display:block;
    font-size:14px;
    line-height:1.15;
  }
  .spell-option-main span{
    display:block;
    margin-top:2px;
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .option-level{
    min-width:22px;
    text-align:center;
    font-size:12px;
    font-weight:900;
    color:#ffd68a;
  }
  .main-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .main-head h1{
    margin:0;
    font-size:20px;
    line-height:1.1;
  }
  .main-head p{
    margin:4px 0 0;
    color:var(--muted);
    font-size:13px;
  }
  .chip-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .chip{
    background:var(--chip);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 10px;
    font-size:12px;
    font-weight:800;
  }
  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:12px;
    align-items:start;
  }
  .empty-state{
    padding:28px;
    text-align:center;
    color:var(--muted);
    border:1px dashed var(--line-2);
    border-radius:14px;
    background:rgba(12,18,27,.55);
  }
  .spell-card{
    background:#fff;
    color:#111;
    border:2px solid #111;
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.18);
  }
  .spell-card-head{
    position:relative;
    min-height:28px;
    border-bottom:2px solid #111;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px 28px;
    font-family:Georgia,"Times New Roman",serif;
    font-weight:900;
    font-size:14px;
    text-align:center;
  }
  .spell-level{
    position:absolute;
    right:5px;
    top:4px;
    width:19px;
    height:19px;
    border:2px solid #111;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:900;
  }
  .spell-meta{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border-bottom:2px solid #111;
  }
  .spell-meta > div{
    border-right:1px solid #111;
    padding:4px 3px;
    text-align:center;
  }
  .spell-meta > div:last-child{border-right:0}
  .spell-meta-label{
    font-size:7px;
    font-weight:900;
    text-transform:uppercase;
  }
  .spell-meta-value{
    font-size:9px;
    font-weight:800;
    margin-top:2px;
  }
  .spell-body{
    padding:8px;
    font-size:11px;
    line-height:1.28;
    white-space:pre-wrap;
    min-height:318px;
  }
  .spell-foot{
    border-top:1px solid #111;
    padding:5px 7px;
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    font-size:10px;
  }
  @media (max-width: 980px){
    .layout{grid-template-columns:1fr}
    .sidebar{
      border-right:0;
      border-bottom:1px solid var(--line);
    }
    .spell-list-scroll{max-height:280px}
  }
  @media (max-width: 640px){
    .topbar{padding:12px}
    .brand{display:block}
    .brand span{display:block;margin-top:3px}
    .main,.sidebar{padding:10px}
    .action-grid{grid-template-columns:1fr}
    .card-grid{grid-template-columns:1fr}
    .spell-body{min-height:0}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <b>Alaric Spell Cards</b>
      <span>Hybrid Spell Browser</span>
    </div>
    <div class="top-actions">
      <a class="btn" href="./index.html">Back To Sheet</a>
      <button class="btn" id="knownBtn" type="button">Use Known Spells</button>
      <button class="btn accent" id="printBtn" type="button">Print Selected</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="panel filter-panel">
        <div class="panel-title">
          <span>Search</span>
          <span class="muted" id="filterCountText"></span>
        </div>

        <div class="filter-row">
          <label for="searchInput">Name</label>
          <div class="search-wrap">
            <input id="searchInput" type="text" placeholder="Search spells">
            <button class="search-clear" id="searchClearBtn" type="button">×</button>
          </div>
        </div>

        <div class="filter-row">
          <label for="classSelect">Class</label>
          <select id="classSelect"></select>
        </div>

        <div class="filter-row">
          <label for="sortSelect">Sort</label>
          <select id="sortSelect">
            <option value="level">Level</option>
            <option value="name">Name</option>
            <option value="school">School</option>
          </select>
        </div>

        <div class="filter-row">
          <label>Levels</label>
          <div class="level-range">
            <input id="minLevelInput" type="number" min="0" max="9" value="0">
            <button class="mini-btn" data-adjust="min" data-delta="-1" type="button">-</button>
            <button class="mini-btn" data-adjust="min" data-delta="1" type="button">+</button>
            <input id="maxLevelInput" type="number" min="0" max="9" value="9">
            <button class="mini-btn" data-adjust="max" data-delta="-1" type="button">-</button>
            <button class="mini-btn" data-adjust="max" data-delta="1" type="button">+</button>
          </div>
        </div>

        <div class="action-grid">
          <button class="btn" id="selectFilteredBtn" type="button">Select Filtered</button>
          <button class="btn" id="clearFilteredBtn" type="button">Clear Filtered</button>
          <button class="btn" id="selectAllBtn" type="button">Select All</button>
          <button class="btn" id="clearAllBtn" type="button">Clear All</button>
        </div>

        <div class="spell-list">
          <div class="panel-title">
            <span>Spells</span>
            <span class="muted" id="selectedCountText"></span>
          </div>
          <div class="spell-list-scroll" id="spellList"></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="main-head">
        <div>
          <h1>Selected Spell Cards</h1>
          <p>Hybrid list: non-UA spells only, preferring 2024 when a spell exists in both editions.</p>
        </div>
        <div class="chip-row">
          <div class="chip" id="hybridCountChip"></div>
          <div class="chip" id="visibleCountChip"></div>
          <div class="chip" id="selectedCountChip"></div>
        </div>
      </div>
      <div id="cardHost"></div>
    </main>
  </div>
</div>

<script src="./spell-data.js"></script>
<script>
const SHEET_STORAGE_KEY = "bladesinger_alaric_pwa_v2";
const PAGE_STORAGE_KEY = "bladesinger_spell_browser_v1";
const SPELLS = Array.isArray(window.SPELL_DATA) ? window.SPELL_DATA.slice() : [];

const state = loadPageState();

function loadPageState(){
  let raw = {};
  try{
    raw = JSON.parse(localStorage.getItem(PAGE_STORAGE_KEY) || "{}") || {};
  }catch{
    raw = {};
  }
  const defaultSelection = getDefaultSelection();
  const selected = Array.isArray(raw.selected) && raw.selected.length ? raw.selected : defaultSelection;
  return {
    search: typeof raw.search === "string" ? raw.search : "",
    className: typeof raw.className === "string" ? raw.className : "all",
    minLevel: clampLevel(raw.minLevel, 0),
    maxLevel: clampLevel(raw.maxLevel, 9),
    sort: ["level","name","school"].includes(raw.sort) ? raw.sort : "level",
    selected: new Set(selected.filter(name => SPELLS.some(spell => spell.name === name)))
  };
}

function savePageState(){
  localStorage.setItem(PAGE_STORAGE_KEY, JSON.stringify({
    search: state.search,
    className: state.className,
    minLevel: state.minLevel,
    maxLevel: state.maxLevel,
    sort: state.sort,
    selected: Array.from(state.selected)
  }));
}

function getDefaultSelection(){
  try{
    const sheet = JSON.parse(localStorage.getItem(SHEET_STORAGE_KEY) || "{}") || {};
    if (Array.isArray(sheet.knownSpells) && sheet.knownSpells.length){
      return unique(sheet.knownSpells);
    }
  }catch{}
  return [];
}

function unique(list){
  return Array.from(new Set(list.filter(Boolean)));
}

function clampLevel(value, fallback){
  const num = Number(value);
  if (!Number.isFinite(num)) return fallback;
  return Math.max(0, Math.min(9, Math.round(num)));
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function classesForSpell(spell){
  return String(spell.classes || "")
    .split(",")
    .map(part => part.trim())
    .filter(Boolean);
}

function allClasses(){
  const classes = new Set();
  SPELLS.forEach(spell => classesForSpell(spell).forEach(name => classes.add(name)));
  return Array.from(classes).sort((a,b) => a.localeCompare(b));
}

function spellMatchesFilters(spell){
  const nameMatch = !state.search || spell.name.toLowerCase().includes(state.search.toLowerCase());
  const classMatch = state.className === "all" || classesForSpell(spell).includes(state.className);
  const level = Number(spell.level || 0);
  const levelMatch = level >= state.minLevel && level <= state.maxLevel;
  return nameMatch && classMatch && levelMatch;
}

function compareSpells(a, b){
  if (state.sort === "name") return a.name.localeCompare(b.name);
  if (state.sort === "school") return a.school.localeCompare(b.school) || Number(a.level) - Number(b.level) || a.name.localeCompare(b.name);
  return Number(a.level) - Number(b.level) || a.name.localeCompare(b.name);
}

function filteredSpells(){
  return SPELLS.filter(spellMatchesFilters).sort(compareSpells);
}

function selectedSpells(){
  return SPELLS
    .filter(spell => state.selected.has(spell.name))
    .sort(compareSpells);
}

function renderClassSelect(){
  const select = document.getElementById("classSelect");
  const options = [`<option value="all">All Classes</option>`]
    .concat(allClasses().map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`));
  select.innerHTML = options.join("");
  select.value = state.className;
}

function renderSpellList(){
  const spells = filteredSpells();
  const host = document.getElementById("spellList");
  host.innerHTML = spells.map(spell => {
    const selected = state.selected.has(spell.name);
    return `
      <label class="spell-option ${selected ? "selected" : ""}">
        <input type="checkbox" data-select="${escapeHtml(spell.name)}" ${selected ? "checked" : ""}>
        <span class="spell-option-main">
          <b>${escapeHtml(spell.name)}</b>
          <span>${escapeHtml(spell.school)} · ${escapeHtml(spell.classes || "-")}</span>
        </span>
        <span class="option-level">${escapeHtml(spell.level)}</span>
      </label>
    `;
  }).join("");
  host.querySelectorAll("[data-select]").forEach(input => {
    input.onchange = () => {
      toggleSpell(input.dataset.select, input.checked);
    };
  });

  document.getElementById("filterCountText").textContent = `${spells.length} shown`;
}

function renderCardHost(){
  const spells = selectedSpells();
  const host = document.getElementById("cardHost");
  if (!spells.length){
    host.innerHTML = `<div class="empty-state">No spells selected yet. Pick spells from the list on the left to render their cards here.</div>`;
    return;
  }
  host.innerHTML = `<div class="card-grid">${spells.map(renderSpellCard).join("")}</div>`;
}

function renderSpellCard(spell){
  return `
    <article class="spell-card">
      <div class="spell-card-head">${escapeHtml(spell.name)}<span class="spell-level">${escapeHtml(spell.level)}</span></div>
      <div class="spell-meta">
        <div><div class="spell-meta-label">Range</div><div class="spell-meta-value">${escapeHtml(spell.range || "-")}</div></div>
        <div><div class="spell-meta-label">Comp</div><div class="spell-meta-value">${escapeHtml(spell.components || "-")}</div></div>
        <div><div class="spell-meta-label">Dur</div><div class="spell-meta-value">${escapeHtml(spell.duration || "-")}</div></div>
        <div><div class="spell-meta-label">Cast</div><div class="spell-meta-value">${escapeHtml(spell.casting_time || "-")}</div></div>
      </div>
      <div class="spell-body">${escapeHtml(spell.description || "")}</div>
      <div class="spell-foot"><span>${escapeHtml(spell.school || "-")}</span><span>${escapeHtml(spell.classes || "-")}</span></div>
    </article>
  `;
}

function renderStats(){
  const filtered = filteredSpells();
  const selected = state.selected.size;
  document.getElementById("selectedCountText").textContent = `${selected} selected`;
  document.getElementById("hybridCountChip").textContent = `Hybrid List ${SPELLS.length}`;
  document.getElementById("visibleCountChip").textContent = `Visible ${filtered.length}`;
  document.getElementById("selectedCountChip").textContent = `Selected ${selected}`;
}

function render(){
  syncControls();
  renderSpellList();
  renderCardHost();
  renderStats();
  savePageState();
}

function syncControls(){
  document.getElementById("searchInput").value = state.search;
  document.getElementById("classSelect").value = state.className;
  document.getElementById("sortSelect").value = state.sort;
  document.getElementById("minLevelInput").value = state.minLevel;
  document.getElementById("maxLevelInput").value = state.maxLevel;
}

function toggleSpell(name, checked){
  if (checked) state.selected.add(name);
  else state.selected.delete(name);
  render();
}

function adjustLevel(which, delta){
  if (which === "min"){
    state.minLevel = clampLevel(state.minLevel + delta, state.minLevel);
    if (state.minLevel > state.maxLevel) state.maxLevel = state.minLevel;
  }else{
    state.maxLevel = clampLevel(state.maxLevel + delta, state.maxLevel);
    if (state.maxLevel < state.minLevel) state.minLevel = state.maxLevel;
  }
  render();
}

function selectFiltered(value){
  filteredSpells().forEach(spell => {
    if (value) state.selected.add(spell.name);
    else state.selected.delete(spell.name);
  });
  render();
}

function selectAll(value){
  if (value){
    SPELLS.forEach(spell => state.selected.add(spell.name));
  }else{
    state.selected.clear();
  }
  render();
}

function useKnownSpells(){
  state.selected = new Set(getDefaultSelection().filter(name => SPELLS.some(spell => spell.name === name)));
  render();
}

function bindEvents(){
  document.getElementById("searchInput").oninput = event => {
    state.search = event.target.value;
    render();
  };
  document.getElementById("searchClearBtn").onclick = () => {
    state.search = "";
    render();
  };
  document.getElementById("classSelect").onchange = event => {
    state.className = event.target.value;
    render();
  };
  document.getElementById("sortSelect").onchange = event => {
    state.sort = event.target.value;
    render();
  };
  document.getElementById("minLevelInput").oninput = event => {
    state.minLevel = clampLevel(event.target.value, 0);
    if (state.minLevel > state.maxLevel) state.maxLevel = state.minLevel;
    render();
  };
  document.getElementById("maxLevelInput").oninput = event => {
    state.maxLevel = clampLevel(event.target.value, 9);
    if (state.maxLevel < state.minLevel) state.minLevel = state.maxLevel;
    render();
  };
  document.querySelectorAll("[data-adjust]").forEach(button => {
    button.onclick = () => adjustLevel(button.dataset.adjust, Number(button.dataset.delta || 0));
  });
  document.getElementById("selectFilteredBtn").onclick = () => selectFiltered(true);
  document.getElementById("clearFilteredBtn").onclick = () => selectFiltered(false);
  document.getElementById("selectAllBtn").onclick = () => selectAll(true);
  document.getElementById("clearAllBtn").onclick = () => selectAll(false);
  document.getElementById("knownBtn").onclick = useKnownSpells;
  document.getElementById("printBtn").onclick = () => window.print();
}

renderClassSelect();
bindEvents();
render();
</script>
</body>
</html>
