<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Orrery with Moons</title>
<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    line-height: 1.35;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background: #000;
  }
  #controls {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(0, 0, 0, 0.88);
    border-bottom: 1px solid #262626;
    padding: 10px;
    text-align: center;
  }
  .time-readout {
    font-size: 14px;
    margin-bottom: 8px;
  }
  #moonElementsStatus {
    margin-top: 4px;
    font-size: 12px;
    color: #9aa0a6;
  }
  .speed-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
    touch-action: pan-y;
  }
  button {
    margin: 0;
    padding: 8px 12px;
    min-height: 38px;
    border: 1px solid #3d3d3d;
    border-radius: 8px;
    background: #161616;
    color: #fff;
    font-size: 14px;
    touch-action: manipulation;
  }
  .control-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 8px 12px;
    align-items: center;
    max-width: 920px;
    margin: 0 auto;
    text-align: left;
  }
  .control-grid label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }
  .control-grid input[type="number"] {
    width: 78px;
    padding: 6px;
    border-radius: 6px;
    border: 1px solid #3d3d3d;
    background: #101010;
    color: #fff;
    font-size: 16px;
  }
  #orbitTableContainer {
    padding: 0 8px 16px;
  }
  h3 {
    margin: 12px 0 6px;
    font-size: 16px;
  }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { padding: 4px 6px; border: 1px solid #444; }
  th { background: #111; color: #fff; }
  td.num, th.num { text-align: right; font-family: monospace; }
  @media (max-width: 768px) {
    .time-readout { font-size: 13px; }
    .speed-buttons {
      justify-content: flex-start;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }
    button {
      flex: 0 0 auto;
      min-width: 86px;
      min-height: 42px;
    }
    table { font-size: 12px; }
    th, td { padding: 3px 4px; }
  }
</style>
</head>
<body>

<div id="controls">
  <div class="time-readout">
    Current Time: <span id="currentTime"></span><br>
    Current Local Time: <span id="localTime"></span><br>
    Days since J2000: <span id="daysSinceJ2000"></span>
    <div id="moonElementsStatus">Moon elements: baseline snapshot</div>
  </div>
  <div class="speed-buttons">
    <button data-speed="1">1x</button>
    <button data-speed="3600">3600x</button>
    <button data-speed="86400">86400x</button>
    <button data-speed="1000000">1,000,000x</button>
    <button data-speed="reset">Reset</button>
    <button id="refreshMoonElementsBtn" type="button">Refresh Moons (JPL)</button>
  </div>
  <div class="control-grid">
    <label for="observerLon">
      Observer longitude (deg):
      <input id="observerLon" type="number" value="153" step="1">
    </label>
    <label for="timeZoneOffset">
      Time zone from GMT:
      <input id="timeZoneOffset" type="number" value="0" step="1">
    </label>
    <label>
      <input type="checkbox" id="showVisibilityLines" checked>
      Show visibility and horizon lines
    </label>
  </div>
</div>

<canvas id="orreryCanvas" width="1200" height="800"></canvas>

<div id="orbitTableContainer">
  <h3>Planet Orbital Data</h3>
  <table id="orbitTable">
    <thead><tr id="orbitTableHead"></tr></thead>
    <tbody id="orbitTableBody"></tbody>
  </table>

  <h3>Moon Orbital Data</h3>
  <table id="moonTable">
    <thead><tr id="moonTableHead"></tr></thead>
    <tbody id="moonTableBody"></tbody>
  </table>
</div>

async function refreshMoonElementsFromApi(force = false, notify = false){
  try {
    const url = force ? "/api/moon-elements?force=1" : "/api/moon-elements";

    const updated = applyMoonSnapshot(data.moons);
    if (!updated) throw new Error("No moon entries updated");
    recomputeMaxMoonDist();

    const stamp = data.generated_at_utc || "unknown";
    const source = data.cached ? "cached weekly snapshot" : "fresh JPL snapshot";
    setMoonStatus(`Moon elements: ${source} (${stamp})`);
    if (notify) window.alert(`Updated ${updated} moon entries (${source}).`);
  } catch (err) {
    console.warn("Moon refresh failed", err);
    setMoonStatus("Moon elements: using embedded fallback");
    if (notify) window.alert(`Moon refresh failed: ${err.message}`);
  }
}

function applyMoonSnapshot(snapshot){
  const byName = new Map(snapshot.map(m => [m.name, m]));
  let updated = 0;

  moons.forEach(m => {
    const src = byName.get(m.name);
    if (!src) return;
    if (
      src.A_km === undefined || src.EC === undefined || src.IN_deg === undefined ||
      src.OM_deg === undefined || src.W_deg === undefined || src.MA_deg === undefined ||
      src.N_deg_per_sec === undefined || src.epoch_jd === undefined
    ) return;

    m.a = Number(src.A_km);
    m.e = Number(src.EC);
    m.i = Number(src.IN_deg);
    m.Omega = Number(src.OM_deg);
    m.omega = Number(src.W_deg);
    m.M0 = Number(src.MA_deg);
    m.n = Number(src.N_deg_per_sec) * 86400;
    m.epoch_jd = Number(src.epoch_jd);
    updated++;
  });
  return updated;
}

// ------------------- ORBIT FUNCTIONS -------------------
function orbitPos(obj,jd){
  const a = obj.a;
  const e = obj.e || 0;
  const M0 = obj.M0 || 0;
  const n = obj.n || Math.sqrt(MU/(a**3))*180/Math.PI*86400;
  const dJ = jd - (obj.epoch_jd || JD_J2000);
  const M = (M0 + n*dJ) % 360;
  let E = M*Math.PI/180;
  for(let i=0;i<8;i++) E = M*Math.PI/180 + e*Math.sin(E);
  const nu = 2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2), Math.sqrt(1-e)*Math.cos(E/2));
  const r = a*(1-e*e)/(1+e*Math.cos(nu));
  const rotated = rotateToEcliptic(obj, r, nu);
  return { ...rotated, r, nu: nu*180/Math.PI, M, E:E*180/Math.PI };
}

function rotateToEcliptic(obj, r, nu){
  const OmegaRad = (obj.Omega || 0) * Math.PI / 180;
  const omegaRad = (obj.omega || 0) * Math.PI / 180;
  const iRad = (obj.i || 0) * Math.PI / 180;
  const theta = omegaRad + nu;

  const cosOmega = Math.cos(OmegaRad);
  const sinOmega = Math.sin(OmegaRad);
  const cosTheta = Math.cos(theta);
  const sinTheta = Math.sin(theta);
  const cosI = Math.cos(iRad);
  const sinI = Math.sin(iRad);

  const x = r * (cosOmega * cosTheta - sinOmega * sinTheta * cosI);
  const y = r * (sinOmega * cosTheta + cosOmega * sinTheta * cosI);
  const z = r * (sinTheta * sinI);
  return { x, y, z };
}

function precomputeOrbit(p, steps=360){
  const pts=[];
  for(let t=0;t<=steps;t++){
    const nu=t*Math.PI/180;
    const r=p.a*(1-p.e*p.e)/(1+p.e*Math.cos(nu));
    pts.push(rotateToEcliptic(p, r, nu));
  }
  return pts;
}

// planetocentric moon position
function moonPosAroundPlanet(moon, jd){
  const a = moon.a;
  const e = moon.e || 0;
  const M0 = moon.M0 || 0;
  const n = moon.n || Math.sqrt(MU/(a**3))*180/Math.PI*86400;
  const dJ = jd - (moon.epoch_jd || JD_J2000);
  const M = (M0 + n*dJ) % 360;

  let E = M*Math.PI/180;
  for(let i=0;i<8;i++) E = M*Math.PI/180 + e*Math.sin(E);

  const nu = 2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2), Math.sqrt(1-e)*Math.cos(E/2));
  const r = a*(1-e*e)/(1+e*Math.cos(nu));
  const rotated = rotateToEcliptic(moon, r, nu);
  return { ...rotated, r, nu: nu*180/Math.PI, M, E:E*180/Math.PI };
}

const maxMoonDist = {};
function recomputeMaxMoonDist(){
  Object.keys(maxMoonDist).forEach(k => delete maxMoonDist[k]);
  moons.forEach(m => {
    const p = m.parent;
    if (!p) return;
    const rel = moonPosAroundPlanet(m, currentJD);

function drawMoon(moonPos, planetPos, planetName, scale, cxRef, cyRef){
  const vx = moonPos.x - planetPos.x;
  const vy = moonPos.y - planetPos.y;
  const r  = Math.hypot(vx, vy);
  if (!r) return;

  const rMax = maxMoonDist[planetName];
  if (!rMax) return;

  const MAX_PIXEL_RADIUS = MOON_SCALE[planetName] || 40;

  const s  = (r / rMax) * MAX_PIXEL_RADIUS;
  const dx = (vx / r) * s;
  const dy = (vy / r) * s;

  ctx.fillStyle = "#0ff";
  ctx.beginPath();
  ctx.arc(
    cxRef + planetPos.x * scale + dx,
    cyRef - planetPos.y * scale - dy,
    2, 0, Math.PI * 2
  );
  ctx.fill();
}
//VISIBILITY CONE BLOCK
function drawVisibilityCone(cxRef, cyRef, scale, jd, maxAU = 10){
    const show = document.getElementById("showVisibilityLines").checked;
    if(!show) return; // skip drawing if unchecked

    const earth = planets.find(p => p.name === "Earth");
    if (!earth) return;

  // Earth heliocentric position
  const e = orbitPos(earth, jd);

  // Earth → Sun direction
  const sunDir = Math.atan2(-e.y, -e.x);

  // Observer longitude
  const obsLonDeg = parseFloat(document.getElementById("observerLon").value || 0);
  const obsLonRad = obsLonDeg * Math.PI / 180;

  // Local solar hour angle:
  // 12:00 local solar time => hourAngle = 0 => zenith aligns with the Sun.
  // JD day starts at noon, so use (jd + 0.5) for midnight-based clock hours.
  const utcHours = (((jd + 0.5) % 1 + 1) % 1) * 24;
  const localSolarHours = ((utcHours + obsLonDeg / 15) % 24 + 24) % 24;
  const hourAngle = (localSolarHours - 12) * Math.PI / 12;

  // Earth rotates eastward (CCW in this top-down view): afternoon should advance
  // CCW from the noon direction, morning should be clockwise.
  const zenith = sunDir + hourAngle;

  // Canvas anchor (Earth, not Sun)
  const ex = cxRef + e.x * scale;
  const ey = cyRef - e.y * scale;

  const L = maxAU * AU * scale;
  const halfCone = 60 * Math.PI / 180; // 120° total

  // -------- Horizon line (perpendicular to zenith) --------
  const hx = Math.cos(zenith + Math.PI / 2);
  const hy = Math.sin(zenith + Math.PI / 2);

  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.setLineDash([5,5]);
  ctx.beginPath();
  ctx.moveTo(ex - hx * L, ey + hy * L);
  ctx.lineTo(ex + hx * L, ey - hy * L);
  ctx.stroke();
  ctx.setLineDash([]);

  // -------- Visibility cone --------
  ctx.strokeStyle = "rgba(0,255,255,0.4)";
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(
    ex + Math.cos(zenith - halfCone) * L,
    ey - Math.sin(zenith - halfCone) * L
  );
  ctx.moveTo(ex, ey);
  ctx.lineTo(
    ex + Math.cos(zenith + halfCone) * L,
    ey - Math.sin(zenith + halfCone) * L
  );
  ctx.stroke();
}

  // Inset
  ctx.save(); 
  ctx.translate(inset.x,inset.y);
  ctx.fillStyle="#000"; ctx.fillRect(0,0,inset.w,inset.h);
  ctx.fillStyle="#ff0"; ctx.beginPath(); ctx.arc(inset.w/2,inset.h/2,4,0,Math.PI*2); ctx.fill();

  const inner = planets.slice(0,4);
  const maxInner = Math.max(...inner.map(p=>p.a*(1+p.e)));
  const s2 = (Math.min(inset.w,inset.h)/2-10)/maxInner;

  // Inner planets
  inner.forEach(p=>{
    if(!p.path) p.path = precomputeOrbit(p);
    ctx.strokeStyle="rgba(255,255,255,0.15)";
    ctx.beginPath();
    p.path.forEach((pt,i)=>{
      const x=inset.w/2 + pt.x*s2;
      const y=inset.h/2 - pt.y*s2;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.stroke();

    const d=orbitPos(p,currentJD);
    const px = inset.w/2 + d.x*s2;
    const py = inset.h/2 - d.y*s2;
    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.arc(px,py,3,0,Math.PI*2); ctx.fill();
    ctx.fillText(p.name, px+3, py-3);
  });

  drawVisibilityCone(
  inset.w / 2,
  inset.h / 2,
  s2,
  currentJD,
  1.5   // AU limit for inset
);


// Draw moons (inset)
moons.forEach(m=>{
    const parent = m.parent;
    if(!parent) return;


  // Moon relative to planet
  const moonRel = moonPosAroundPlanet(m, currentJD);

  // Absolute moon position
  const moonAbs = {
    x: parent.x + moonRel.x,
    y: parent.y + moonRel.y
  };

  drawMoon(moonAbs, parent, parent.name, s2, inset.w/2, inset.h/2);
});


  ctx.restore();

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
