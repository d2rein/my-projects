<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Meme Search v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body{
  font-family:system-ui;
  background:#111;
  color:#eee;
  margin:0;
  padding:10px;
}

h2{ margin:8px 0 10px; }

#topChrome{
  position:sticky;
  top:0;
  z-index:20;
  background:#111;
  padding-top:6px;
  padding-bottom:8px;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  margin-bottom:10px;
}

#titleBtn{
  margin:8px 0 10px;
  padding:0;
  border:none;
  background:none;
  color:#eee;
  font:inherit;
  font-weight:700;
  cursor:pointer;
}

#titleBtn h2{
  margin:0;
}

.searchWrap{
  position:relative;
  flex:1 1 240px;
}

input#search{
  width:100%;
  padding:12px 44px 12px 12px;
  font-size:16px;
  border-radius:6px;
  border:none;
}

#clearSearchBtn{
  position:absolute;
  top:50%;
  right:10px;
  transform:translateY(-50%);
  width:28px;
  height:28px;
  border:none;
  border-radius:999px;
  background:#ddd;
  color:#111;
  font-size:18px;
  line-height:1;
  cursor:pointer;
  display:none;
  align-items:center;
  justify-content:center;
  padding:0;
}

#clearSearchBtn.visible{
  display:flex;
}

select,button.toggle{
  padding:10px;
  border-radius:6px;
  border:none;
  background:#222;
  color:#eee;
  cursor:pointer;
}

button.toggle.active{ background:#3a5cff; }

#resultCount{
  font-size:14px;
  color:#bbb;
  margin:6px 0 10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px;
}

.thumb{
  width:100%;
  height:140px;
  object-fit:cover;
  border-radius:6px;
  cursor:pointer;
  background:#222;
}

.thumb:hover{ transform:scale(1.03); }

/* viewer */

#viewer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  z-index:1000;
  flex-direction:column;
  align-items:center;
}

#viewerBar{
  position:absolute;
  top:10px;
  right:10px;
  display:flex;
  gap:10px;
  z-index:2;
}

#viewerBar button{
  font-size:16px;
  padding:8px 12px;
}

#imageFrame{
  width:90vw;
  height:70vh;
  margin-top:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

#imageFrame.zoomed{
  overflow:auto;
  align-items:flex-start;
  justify-content:flex-start;
}

#fullImage{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  cursor:zoom-in;
}

/* navigation arrows */

.navArrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:28px;
  color:white;
  background:rgba(0,0,0,.28);
  border:none;
  cursor:pointer;
  padding:10px 12px;
  border-radius:999px;
  z-index:1;
}

#prevBtn{ left:10px; }
#nextBtn{ right:10px; }

/* similar strip */

#similarStrip{
  width:90vw;
  margin-top:14px;
  overflow-x:auto;
  display:block;
}

#similarRow{
  display:flex;
  gap:8px;
}

.similarThumb{
  height:80px;
  flex:0 0 auto;
  border-radius:6px;
  cursor:pointer;
}

.similarThumb.active{
  outline:3px solid #3a5cff;
  transform:scale(1.05);
}

#backBtn{
  position:absolute;
  top:10px;
  left:10px;
  z-index:2;
  padding:8px 12px;
  font-size:16px;
  border:none;
  border-radius:6px;
  background:#222;
  color:#eee;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="topChrome">
<button id="titleBtn" type="button"><h2>😂 Meme Search v2</h2></button>

<div class="controls">
<div class="searchWrap">
<input id="search" placeholder="Search...">
<button id="clearSearchBtn" type="button" aria-label="Clear search">×</button>
</div>

<select id="sortSelect">
<option value="relevance">Relevance</option>
<option value="date" selected>Newest</option>
<option value="name">Filename</option>
</select>

<select id="limitSelect">
<option value="10">10</option>
<option value="30">30</option>
<option value="50">50</option>
<option value="100">100</option>
<option value="9999" selected>All</option>
</select>

<button class="toggle" id="modeText">Text</button>
<button class="toggle" id="modeVisual">Visual</button>
<button class="toggle active" id="modeHybrid">Hybrid</button>
</div>
</div>

<div id="resultCount"></div>
<div class="grid" id="results"></div>

<div id="viewer">

<div id="viewerBar">
<button id="similarBtn">Find Similar</button>
<button id="shareBtn">Share</button>
<button id="closeBtn" aria-label="Close viewer">Close</button>
</div>

<button id="backBtn">Back To Results</button>

<div id="imageFrame">
<button class="navArrow" id="prevBtn" aria-label="Previous image">&#8249;</button>
<img id="fullImage">
<button class="navArrow" id="nextBtn" aria-label="Next image">&#8250;</button>
</div>

<div id="fileName" style="margin-top:8px;font-size:14px;color:#aaa"></div>

<div id="similarStrip">
<div id="similarRow"></div>
</div>

</div>

<script>

let memes=[];
let currentLimit=9999;
let mode="hybrid";
let currentOpenIndex=-1;
let zoom=false;

let currentResults=[];
let sortMode="date";

let similarList=[];
let previousResults=[];
let inSimilarMode=false;
let similarSourceIndex=-1;
let embeddingsLoaded=false;
let embeddingsPromise=null;
let thumbQueue=[];
let thumbActiveCount=0;
let thumbQueuePaused=false;
let thumbRenderToken=0;
let viewerImageRequestId=0;
let tokenDocumentFrequency=new Map();
let totalTokenDocuments=0;
const DEFAULT_SEARCH_PLACEHOLDER="Search...";
const SIMILAR_SEARCH_LABEL="Find Similar";

const SIMILAR_COUNT=60;
const EMBEDDING_DIM=768;
const THUMB_CONCURRENCY=10;
const THUMB_PRIORITY_COUNT=120;
const VIEWER_PRELOAD_COUNT=1;
const SIMILAR_VISUAL_POOL=300;
const SIMILAR_TEXT_WEIGHT=0.55;
const SIMILAR_SHARED_TAG_WEIGHT=0.18;
const STANDALONE_MEMES_ASSET_BASE="https://71a2a7c2.my-projects-cqs.pages.dev/memes_v2/";
const assetBase=location.hostname==="meme-search-v2-d2rei.pages.dev"
? STANDALONE_MEMES_ASSET_BASE
: new URL("./",window.location.href).toString();
const STOP_WORDS=new Set([
"the","and","for","you","that","with","this","have","from","your","was","are","but","not","all","too","they","them",
"his","her","she","him","our","out","get","got","has","had","its","it's","into","about","just","there","their","what",
"when","where","who","why","how","can","could","would","should","than","then","because","been","being","also","over",
"more","most","some","such","only","very","like","look","looks","looking","still","back","here","were","will","want",
"dont","don't","cant","can't","didnt","didn't","ive","i've","im","i'm","thats","that's","theyre","they're","https",
"http","www","com","jpg","jpeg","png","webp","screenshot","received","chrome","messenger","reddit","twitter","x","imgur"
]);
const SIMILAR_TAG_GROUPS={
painting:["painting","painted","artwork","watercolor","watercolour","oil","canvas","illustration","impressionist"],
boat:["boat","boats","ship","ships","harbor","harbour","sail","sailing","sailboat","vessel","raft","yacht"],
comic:["comic","cartoon","calvin","hobbes","panel","panels"],
screenshot:["screenshot","tweet","reddit","post","conversation","text","dm","message"],
map:["map","atlas","chart","diagram","route","routes"],
game:["game","gaming","runescape","pokemon","pogo","steam","nintendo","xbox","playstation"]
};

/* helpers */

function dot(a,b){
let s=0;
for(let i=0;i<a.length;i++) s+=a[i]*b[i];
return s;
}

function assetUrl(path){
return new URL(path,assetBase).toString();
}

function tokenize(text){
return String(text || "")
.toLowerCase()
.replace(/[_/\\.,:;!?()[\]{}"'`~|@#$%^&*+=<>-]+/g," ")
.split(/\s+/)
.map(token=>token.trim())
.filter(token=>token.length>=3 && !STOP_WORDS.has(token) && !/^\d+$/.test(token));
}

function extractSourceLabel(meme){
const parts=String(meme.basename || "").split("_").filter(Boolean);
if(parts.length===0) return "";
const tail=parts[parts.length-1].toLowerCase();
if(/^\d+$/.test(tail)) return "";
return tail;
}

function buildSearchProfile(meme){
const textTokens=tokenize(meme.text);
const captionTokens=tokenize(meme.caption);
const nameTokens=tokenize(meme.basename);
const sourceLabel=extractSourceLabel(meme);
const sourceTokens=tokenize(sourceLabel);
const allTokens=[...textTokens,...captionTokens,...nameTokens,...sourceTokens];
const uniqueTokens=[...new Set(allTokens)];
const cleanTokens=[...new Set([...captionTokens,...nameTokens])];
const rawSimilarityText=`${String(meme.caption || "").toLowerCase()} ${String(meme.basename || "").toLowerCase().replace(/_/g," ")}`;
const similarTags=Object.entries(SIMILAR_TAG_GROUPS)
.filter(([,words])=>words.some(word=>rawSimilarityText.includes(word)))
.map(([tag])=>tag);

return {
textTokens,
captionTokens,
nameTokens,
sourceLabel,
sourceTokens,
allTokens,
uniqueTokens,
cleanTokens,
similarTags
};
}

function idfForToken(token){
const docFreq=tokenDocumentFrequency.get(token) || 1;
return Math.log(1 + (totalTokenDocuments / docFreq));
}

function weightedTokenOverlap(aTokens,bTokens){
if(!aTokens.length || !bTokens.length) return 0;
const aSet=new Set(aTokens);
const bSet=new Set(bTokens);
let shared=0;
let total=0;
const seen=new Set([...aSet,...bSet]);
seen.forEach(token=>{
const weight=idfForToken(token);
const inA=aSet.has(token);
const inB=bSet.has(token);
if(inA || inB) total+=weight;
if(inA && inB) shared+=weight;
});
return total ? shared / total : 0;
}

function cleanTokenOverlap(aTokens,bTokens){
if(!aTokens.length || !bTokens.length) return 0;
const aSet=new Set(aTokens);
const bSet=new Set(bTokens);
let shared=0;
for(const token of aSet){
if(bSet.has(token)) shared++;
}
return shared / Math.max(1,new Set([...aSet,...bSet]).size);
}

function sharedTagCount(aTags,bTags){
if(!aTags.length || !bTags.length) return 0;
const bSet=new Set(bTags);
let shared=0;
for(const tag of aTags){
if(bSet.has(tag)) shared++;
}
return shared;
}

function buildTokenDocumentFrequency(items){
tokenDocumentFrequency=new Map();
totalTokenDocuments=items.length;
items.forEach(item=>{
const unique=new Set(item.profile.uniqueTokens);
unique.forEach(token=>{
tokenDocumentFrequency.set(token,(tokenDocumentFrequency.get(token) || 0) + 1);
});
});
}

function ocrScore(m,words){
let score=0;
for(const w of words){
if(m.text && m.text.includes(w)) score++;
if(m.caption && m.caption.includes(w)) score++;
}
return score;
}

function preloadNeighbors(index){

let pos = currentResults.findIndex(m => m._index === index);
if(pos===-1 || currentResults.length===0) return;

for(let i=1;i<=VIEWER_PRELOAD_COUNT;i++){

const prev = currentResults[(pos - i + currentResults.length) % currentResults.length];
const next = currentResults[(pos + i) % currentResults.length];

const prevLoader=new Image();
prevLoader.decoding="async";
prevLoader.src = assetUrl(memes[prev._index].file);

const nextLoader=new Image();
nextLoader.decoding="async";
nextLoader.src = assetUrl(memes[next._index].file);

}

}

function pauseThumbQueue(){
thumbQueuePaused=true;
}

function resumeThumbQueue(){
thumbQueuePaused=false;
pumpThumbQueue();
}

function enqueueThumbLoad(element,src,priority,token){
thumbQueue.push({element,src,priority,token});
thumbQueue.sort((a,b)=>a.priority-b.priority);
pumpThumbQueue();
}

function pumpThumbQueue(){
while(!thumbQueuePaused && thumbActiveCount<THUMB_CONCURRENCY && thumbQueue.length){
const job=thumbQueue.shift();
if(job.token!==thumbRenderToken) continue;
if(!job.element.isConnected) continue;
thumbActiveCount++;

const loader=new Image();
loader.decoding="async";
loader.onload=()=>{
if(job.token===thumbRenderToken && job.element.isConnected){
job.element.src=job.src;
job.element.dataset.loaded="1";
}
thumbActiveCount=Math.max(0,thumbActiveCount-1);
pumpThumbQueue();
};
loader.onerror=()=>{
thumbActiveCount=Math.max(0,thumbActiveCount-1);
pumpThumbQueue();
};
loader.src=job.src;
}
}

/* render */

function render(list){

const results=document.getElementById("results");
const rc=document.getElementById("resultCount");

results.innerHTML="";

const shown=list.slice(0,currentLimit);
thumbRenderToken++;
thumbQueue=[];

rc.textContent=`${Math.min(list.length,currentLimit)} of ${list.length} results`;

shown.forEach((m,idx)=>{
const img=document.createElement("img");
img.className="thumb";
img.alt=m.basename + m.ext;
img.decoding="async";
img.src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
img.onclick=()=>openViewer(m._index);
results.appendChild(img);

const priority=idx<THUMB_PRIORITY_COUNT ? idx : THUMB_PRIORITY_COUNT + idx;
enqueueThumbLoad(img,assetUrl(m.thumb),priority,thumbRenderToken);
});

}

function updateSearchUi(){
const search=document.getElementById("search");
const clearBtn=document.getElementById("clearSearchBtn");
const hasText=search.value.trim().length>0;
const showClear=hasText || inSimilarMode;
clearBtn.classList.toggle("visible",showClear);
search.placeholder=inSimilarMode ? SIMILAR_SEARCH_LABEL : DEFAULT_SEARCH_PLACEHOLDER;
}

function updateViewerUi(){
document.getElementById("backBtn").style.display = inSimilarMode ? "block" : "none";
document.getElementById("similarStrip").style.display = currentResults.length > 1 ? "block" : "none";
document.getElementById("similarBtn").textContent = inSimilarMode ? "Refresh Similar" : "Find Similar";
updateSearchUi();
}

function viewerUrlForIndex(index){
const url=new URL(window.location.href);
url.searchParams.set("m", memes[index].file);
return url.toString();
}

/* search */

function applySearch(){

const q=document.getElementById("search").value.toLowerCase().trim();
const words=q ? q.split(/\s+/) : [];
const hadSimilarMode=inSimilarMode;

if(hadSimilarMode && q){
inSimilarMode=false;
similarSourceIndex=-1;
similarList=[];
previousResults=[];
}

if(!q){

currentResults=[...memes];
inSimilarMode=false;
similarSourceIndex=-1;
similarList=[];
updateViewerUi();

if(sortMode==="date"){
currentResults.sort((a,b)=>new Date(b.modified)-new Date(a.modified));
}

if(sortMode==="name"){
currentResults.sort((a,b)=>a.basename.localeCompare(b.basename));
}

render(currentResults);
return;

}

const scored=memes
.map(m=>({...m,score:ocrScore(m,words)}))
.filter(m=>m.score>0)
.sort((a,b)=>b.score-a.score);

if(sortMode==="date"){
scored.sort((a,b)=>new Date(b.modified)-new Date(a.modified));
}

if(sortMode==="name"){
scored.sort((a,b)=>a.basename.localeCompare(b.basename));
}

currentResults=scored;
inSimilarMode=false;
similarSourceIndex=-1;
updateViewerUi();

render(currentResults);

}

function resetToStart(){
document.getElementById("search").value="";
similarList=[];
previousResults=[];
inSimilarMode=false;
similarSourceIndex=-1;
currentOpenIndex=-1;
viewerImageRequestId++;
document.getElementById("viewer").style.display="none";
const url=new URL(window.location.href);
url.searchParams.delete("m");
window.history.replaceState(null,"",url.toString());
updateViewerUi();
applySearch();
resumeThumbQueue();
}

/* viewer */

function openViewer(index){

currentOpenIndex=index;
window.history.replaceState(null,"",viewerUrlForIndex(index));

const viewer=document.getElementById("viewer");
const img=document.getElementById("fullImage");

viewer.style.display="flex";
updateViewerUi();

img.src="";
viewerImageRequestId++;
pauseThumbQueue();

const requestId=viewerImageRequestId;
img.src=assetUrl(memes[index].thumb);
img.style.maxWidth="100%";
img.style.maxHeight="100%";
img.style.width="";

const loader=new Image();
loader.decoding="async";
loader.fetchPriority="high";
loader.src=assetUrl(memes[index].file);

loader.onload=()=>{
if(requestId!==viewerImageRequestId) return;
img.src=loader.src;
resumeThumbQueue();
preloadNeighbors(index);
};
loader.onerror=()=>{
if(requestId!==viewerImageRequestId) return;
resumeThumbQueue();
};

zoom=false;
document.getElementById("imageFrame").classList.remove("zoomed");

document.getElementById("fileName").textContent =
memes[index].basename + memes[index].ext;

renderSimilar();
centerThumbnail(index);

}

/* zoom */

document.getElementById("fullImage").onclick=()=>{

const frame=document.getElementById("imageFrame");
const img=document.getElementById("fullImage");

if(!zoom){

frame.classList.add("zoomed");

img.style.maxWidth="none";
img.style.maxHeight="none";
img.style.width="100%";

zoom=true;

}else{

frame.classList.remove("zoomed");

img.style.width="";
img.style.maxWidth="100%";
img.style.maxHeight="100%";

zoom=false;

}

};

/* build similar */

async function ensureEmbeddingsLoaded(){
if(embeddingsLoaded) return;
if(embeddingsPromise) return embeddingsPromise;

embeddingsPromise=(async()=>{
const status=document.getElementById("resultCount");
const previousText=status.textContent;
status.textContent="Loading visual index...";

let embeddings=[];
let binIndex=0;

while(true){
try{
const path=assetUrl(`embeddings/emb_${String(binIndex).padStart(3,"0")}.bin`);
const res=await fetch(path);
if(!res.ok) break;
const buffer=await res.arrayBuffer();
embeddings.push(new Float32Array(buffer));
binIndex++;
}catch(e){
break;
}
}

if(embeddings.length===0){
status.textContent=previousText;
throw new Error("No embedding bins found.");
}

const totalLength=embeddings.reduce((a,b)=>a+b.length,0);
const merged=new Float32Array(totalLength);

let offset=0;
for(const arr of embeddings){
merged.set(arr,offset);
offset+=arr.length;
}

const rowCount=Math.floor(merged.length/EMBEDDING_DIM);
for(let i=0;i<Math.min(memes.length,rowCount);i++){
memes[i].embVec=merged.subarray(i*EMBEDDING_DIM,(i+1)*EMBEDDING_DIM);
}
for(let i=rowCount;i<memes.length;i++){
memes[i].embVec=null;
}

embeddingsLoaded=true;
embeddingsPromise=null;
status.textContent=previousText;
})();

return embeddingsPromise;
}

async function buildSimilar(index){

await ensureEmbeddingsLoaded();

const base=memes[index];
if(!base.embVec){
throw new Error("No embedding available for this image yet.");
}
similarList=[];
previousResults=[...currentResults];
inSimilarMode=true;
similarSourceIndex=index;
document.getElementById("search").value=SIMILAR_SEARCH_LABEL;
updateViewerUi();

for(let i=0;i<memes.length;i++){

if(i===index) continue;

const m=memes[i];
if(!m.embVec) continue;

const s=dot(base.embVec,m.embVec);

similarList.push({idx:i,score:s});

}

similarList.sort((a,b)=>b.score-a.score);

const baseProfile=base.profile || {cleanTokens:[],similarTags:[]};
similarList=similarList
.slice(0,SIMILAR_VISUAL_POOL)
.map(item=>{
const candidate=memes[item.idx];
const candidateProfile=candidate.profile || {cleanTokens:[],similarTags:[]};
const tokenScore=cleanTokenOverlap(baseProfile.cleanTokens || [],candidateProfile.cleanTokens || []);
const tagScore=sharedTagCount(baseProfile.similarTags || [],candidateProfile.similarTags || []);
return {
...item,
score:item.score + (tokenScore * SIMILAR_TEXT_WEIGHT) + (tagScore * SIMILAR_SHARED_TAG_WEIGHT)
};
})
.sort((a,b)=>b.score-a.score);

currentResults = [base,...similarList
.slice(0,SIMILAR_COUNT)
.map(x=>memes[x.idx])];

render(currentResults);

renderSimilar();
openViewer(index);

}
function renderSimilar(){

const row=document.getElementById("similarRow");
row.innerHTML="";

currentResults.slice(0,SIMILAR_COUNT).forEach((m,i)=>{

const img=document.createElement("img");
img.src=assetUrl(m.thumb);
img.className="similarThumb";

if(m._index===currentOpenIndex){
img.classList.add("active");
}

img.onclick=()=>{
openViewer(m._index);
};

row.appendChild(img);

});

}

/* navigation */

function nextImage(){

let idx=currentResults.findIndex(m=>m._index===currentOpenIndex);

idx=(idx+1)%currentResults.length;

openViewer(currentResults[idx]._index);

}

function prevImage(){

let idx=currentResults.findIndex(m=>m._index===currentOpenIndex);

idx=(idx-1+currentResults.length)%currentResults.length;

openViewer(currentResults[idx]._index);

}

document.getElementById("nextBtn").onclick = nextImage;
document.getElementById("prevBtn").onclick = prevImage;

/* swipe */

let touchStartX=0;

document.getElementById("imageFrame").addEventListener("touchstart",(e)=>{
touchStartX=e.touches[0].clientX;
});

document.getElementById("imageFrame").addEventListener("touchend",(e)=>{

const dx=e.changedTouches[0].clientX-touchStartX;

if(Math.abs(dx)>50){

if(dx<0) nextImage();
else prevImage();

}

});

/* center thumbnail */

function centerThumbnail(index){

const row=document.getElementById("similarRow");

[...row.children].forEach(el=>{

if(el.src.includes(memes[index].thumb)){

const left=el.offsetLeft-(row.clientWidth/2)+(el.clientWidth/2);

row.parentElement.scrollTo({left,behavior:"smooth"});

}

});

}

/* controls */

document.getElementById("limitSelect").addEventListener("change",()=>{
currentLimit=parseInt(document.getElementById("limitSelect").value);
applySearch();
});

document.getElementById("search").addEventListener("input",applySearch);
document.getElementById("clearSearchBtn").onclick=resetToStart;
document.getElementById("titleBtn").onclick=resetToStart;

document.getElementById("modeText").onclick=()=>setMode("text");
document.getElementById("modeVisual").onclick=()=>setMode("visual");
document.getElementById("modeHybrid").onclick=()=>setMode("hybrid");

document.getElementById("sortSelect").addEventListener("change",()=>{
sortMode=document.getElementById("sortSelect").value;
applySearch();
});

function setMode(newMode){
mode=newMode;

modeText.classList.toggle("active",mode==="text");
modeVisual.classList.toggle("active",mode==="visual");
modeHybrid.classList.toggle("active",mode==="hybrid");

applySearch();
}

/* buttons */

document.getElementById("similarBtn").onclick=()=>{
(async()=>{
const btn=document.getElementById("similarBtn");
const originalText=btn.textContent;
btn.disabled=true;
btn.textContent="Loading...";
pauseThumbQueue();
try{
await buildSimilar(currentOpenIndex);
}catch(err){
console.error(err);
alert("Find Similar is not available right now.");
inSimilarMode=false;
currentResults = previousResults.length ? [...previousResults] : [...memes];
updateViewerUi();
render(currentResults);
}finally{
btn.disabled=false;
btn.textContent=originalText;
updateViewerUi();
resumeThumbQueue();
}
})();
};

document.getElementById("backBtn").onclick=()=>{
const targetIndex=similarSourceIndex!==-1 ? similarSourceIndex : currentOpenIndex;
document.getElementById("search").value="";
similarList=[];
inSimilarMode=false;
currentResults = previousResults.length ? [...previousResults] : [...memes];
similarSourceIndex=-1;
updateViewerUi();
render(currentResults);
openViewer(targetIndex);
};

/* close */

document.getElementById("closeBtn").onclick=()=>{
viewer.style.display="none";
similarList=[];
inSimilarMode=false;
similarSourceIndex=-1;
viewerImageRequestId++;
resumeThumbQueue();
updateViewerUi();
const url=new URL(window.location.href);
url.searchParams.delete("m");
window.history.replaceState(null,"",url.toString());
};

document.getElementById("shareBtn").onclick=async()=>{
if(currentOpenIndex<0) return;
const url=viewerUrlForIndex(currentOpenIndex);
const title=memes[currentOpenIndex].basename + memes[currentOpenIndex].ext;

try{
const imageUrl = assetUrl(memes[currentOpenIndex].file);
const response = await fetch(imageUrl);
const blob = await response.blob();
const file = new File([blob], `${memes[currentOpenIndex].basename}${memes[currentOpenIndex].ext}`, {
type: blob.type || "image/jpeg"
});

if(navigator.canShare && navigator.canShare({files:[file]})){
await navigator.share({title, files:[file]});
return;
}

if(navigator.share){
await navigator.share({title, url});
return;
}
await navigator.clipboard.writeText(url);
alert("Link copied.");
}catch(err){
console.error(err);
}
};

/* load metadata + embeddings */

async function loadData(){

// load meme metadata
const meta = await fetch(assetUrl("memes.json")).then(r=>r.json());

memes = meta.map((m,i)=>({...m,_index:i}));
memes.forEach(m=>{ m.profile = buildSearchProfile(m); });
buildTokenDocumentFrequency(memes);

sortMode = document.getElementById("sortSelect").value;

applySearch();

const sharedFile = new URL(window.location.href).searchParams.get("m");
if(sharedFile){
const match = memes.find(m=>m.file===sharedFile);
if(match){
openViewer(match._index);
}
}

}
document.getElementById("resultCount").textContent="Loading...";

loadData();

</script>
