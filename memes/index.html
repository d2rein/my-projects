<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Meme Search</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  font-family: system-ui;
  background: #111;
  color: #eee;
  margin: 0;
  padding: 10px;
}

h2 { margin: 8px 0 10px; }

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
}

input#search {
  flex: 1 1 240px;
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
}

select, button.toggle {
  padding: 10px 10px;
  border-radius: 6px;
  border: none;
  background: #222;
  color: #eee;
  cursor: pointer;
}

button.toggle.active {
  background: #3a5cff;
}

#resultCount {
  font-size: 14px;
  color: #bbb;
  margin: 6px 0 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}

.thumb {
  width: 100%;
  height: 140px;
  object-fit: cover;
  border-radius: 6px;
  cursor: pointer;
  background: #222;
  transition: transform 0.15s ease;
}

.thumb:hover {
  transform: scale(1.03);
}

/* viewer */

#viewer {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.96);
  display: none;           /* hidden by default */
  z-index: 1000;
  text-align: center;
  padding-top: 60px;
}

#viewerBar {
  position: fixed;
  top: 10px;
  right: 10px;
}

#closeBtn {
  font-size: 26px;
  padding: 6px 12px;
}

#fullImage {
  max-width: 95vw;
  max-height: 80vh;
  object-fit: contain;
  display: block;
  margin: auto;
  cursor: zoom-in;
  transition: transform 0.15s ease;
}

#similarStrip {
  max-width: 1000px;
  margin: 16px auto 0;
  padding: 0 10px;
}

#similarStripTitle {
  color: #bbb;
  font-size: 14px;
  margin: 10px 0 8px;
}

.similarGrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 8px;
}

.similarThumb {
  width: 100%;
  height: 90px;
  object-fit: cover;
  border-radius: 6px;
  cursor: pointer;
  background: #222;
}
</style>
</head>

<body>

<h2>😂 Meme Search</h2>

<div class="controls">
<input id="search" placeholder="Search… (text or concepts like 'painting', 'cricket match', 'watch')" />

<select id="limitSelect">
<option value="10">10</option>
<option value="30">30</option>
<option value="50">50</option>
<option value="100">100</option>
<option value="9999" selected>All</option>
</select>

<button class="toggle" id="modeText">Text</button>
<button class="toggle" id="modeVisual">Visual</button>
<button class="toggle active" id="modeHybrid">Hybrid</button>
</div>

<div id="resultCount"></div>
<div class="grid" id="results"></div>

<div id="viewer">

<div id="viewerBar">
<button id="closeBtn">✕</button>
</div>

<img id="fullImage">

<div id="similarStrip">
<div id="similarStripTitle">Similar</div>
<div class="similarGrid" id="similarGrid"></div>
</div>

</div>

<script>

let memes = [];
let currentLimit = 9999;
let mode = "hybrid";
let currentOpenIndex = -1;
let zoom = 1;
const SIMILAR_COUNT = 60;

/* math helpers */

function dot(a,b){
  let s=0;
  for(let i=0;i<a.length;i++) s+=a[i]*b[i];
  return s;
}

function ocrScore(m,words){
  let score=0;
  for(const w of words){
    if(m.text && m.text.includes(w)) score++;
    if(m.caption && m.caption.includes(w)) score++;
  }
  return score;
}

/* mode switching */

function setMode(newMode){

mode=newMode;

document.getElementById("modeText").classList.toggle("active",mode==="text");
document.getElementById("modeVisual").classList.toggle("active",mode==="visual");
document.getElementById("modeHybrid").classList.toggle("active",mode==="hybrid");

applySearch();
}

/* render */

function render(list){

const results=document.getElementById("results");
const rc=document.getElementById("resultCount");

results.innerHTML="";

const shown=list.slice(0,currentLimit);

rc.textContent=`${Math.min(list.length,currentLimit)} of ${list.length} results`;

shown.forEach(m=>{
const img=document.createElement("img");
img.src=m.thumb;
img.className="thumb";
img.onclick=()=>openViewer(m._index);
results.appendChild(img);
});

}

/* search */

function applySearch(){

const q=document.getElementById("search").value.toLowerCase().trim();
const words=q ? q.split(/\s+/) : [];

if(!q){
render(memes);
return;
}

const scored=memes
.map(m=>({...m,score:ocrScore(m,words)}))
.filter(m=>m.score>0)
.sort((a,b)=>b.score-a.score);

render(scored);

}

/* viewer */

function openViewer(index){

currentOpenIndex=index;
zoom=1;

const viewer=document.getElementById("viewer");
const fullImage=document.getElementById("fullImage");

document.body.style.overflow="hidden";

viewer.style.display="block";
fullImage.style.transform="scale(1)";
fullImage.src="";

const img=new Image();
img.src=memes[index].file;

img.onload=()=>{
fullImage.src=img.src;
};

showSimilar(index);

}

/* similar search */

function showSimilar(index){

const base=memes[index];
if(!base.embVec) return;

const sims=[];

for(let i=0;i<memes.length;i++){

if(i===index) continue;

const m=memes[i];
if(!m.embVec) continue;

const s=dot(base.embVec,m.embVec);

sims.push({idx:i,score:s});

}

sims.sort((a,b)=>b.score-a.score);

const top=sims.slice(0,SIMILAR_COUNT);

const grid=document.getElementById("similarGrid");

grid.innerHTML="";

top.forEach(x=>{
const m=memes[x.idx];

const img=document.createElement("img");
img.src=m.thumb;
img.className="similarThumb";
img.onclick=()=>openViewer(x.idx);

grid.appendChild(img);

});

}

/* close viewer */

document.getElementById("closeBtn").onclick=()=>{
document.body.style.overflow="auto";
document.getElementById("viewer").style.display="none";
};

document.getElementById("viewer").onclick=(e)=>{
if(e.target.id==="viewer"){
document.body.style.overflow="auto";
document.getElementById("viewer").style.display="none";
}
};

/* zoom */

document.getElementById("fullImage").onclick=()=>{
zoom=zoom===1?2:1;
document.getElementById("fullImage").style.transform=`scale(${zoom})`;
};

/* controls */

document.getElementById("limitSelect").addEventListener("change",()=>{
currentLimit=parseInt(document.getElementById("limitSelect").value);
applySearch();
});

document.getElementById("search").addEventListener("input",applySearch);

document.getElementById("modeText").onclick=()=>setMode("text");
document.getElementById("modeVisual").onclick=()=>setMode("visual");
document.getElementById("modeHybrid").onclick=()=>setMode("hybrid");

/* keyboard navigation */

document.addEventListener("keydown",(e)=>{

const viewerOpen=document.getElementById("viewer").style.display==="flex";

if(!viewerOpen) return;

if(e.key==="ArrowRight"){
openViewer((currentOpenIndex+1)%memes.length);
}

if(e.key==="ArrowLeft"){
openViewer((currentOpenIndex-1+memes.length)%memes.length);
}

if(e.key==="Escape"){
document.body.style.overflow="auto";
document.getElementById("viewer").style.display="none";
}

});

/* load data */

fetch("memes.json")
.then(res=>res.json())
.then(data=>{

memes=data.map((m,i)=>{

const out={...m,_index:i};

if(m.emb && Array.isArray(m.emb)){
out.embVec=new Float32Array(m.emb);
}else{
out.embVec=null;
}

return out;

});

applySearch();

});

</script>

</body>
</html>
