<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Adelaide Oval Scoreboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #8cb4d9;
      --frame: #ead7ad;
      --frame-shadow: #b79d68;
      --board: #141414;
      --board-deep: #080808;
      --led: #f2c537;
      --chalk: #f7f3e7;
      --muted: #d8c590;
      --grid: rgba(255, 214, 92, 0.16);
      --trim: #49391d;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.35), transparent 34%),
        linear-gradient(180deg, var(--sky) 0%, #a5c2db 45%, #7ea2bf 100%);
      color: var(--chalk);
      font-family: "Oswald", sans-serif;
      text-transform: uppercase;
    }

    body {
      display: grid;
      place-items: center;
      padding: 0.8rem;
    }

    .page {
      width: min(100vw - 1rem, 1100px);
      display: grid;
      gap: 0.8rem;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      color: #23384d;
      font-size: 0.88rem;
      letter-spacing: 0.05em;
    }

    .topbar a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid rgba(35, 56, 77, 0.35);
    }

    .note {
      justify-self: end;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(8px);
    }

    .scene {
      width: 100%;
      aspect-ratio: 1.57 / 1;
      position: relative;
    }

    .scoreboard-shell {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      border-radius: 1.7rem 1.7rem 0.8rem 0.8rem;
      padding: 0.7rem 0.9rem 0.75rem;
      background: linear-gradient(180deg, #392d1d 0%, #1a140d 100%);
      box-shadow:
        inset 0 0 0 0.28rem var(--frame),
        inset 0 0 0 0.82rem var(--frame-shadow),
        0 1.2rem 2.5rem rgba(15, 20, 25, 0.35);
    }

    .pediment {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      min-height: 6.6rem;
      gap: 0.5rem;
      padding: 1.35rem 1rem 0.7rem;
      border-radius: 1rem 1rem 0 0;
      clip-path: polygon(0 100%, 0 37%, 22% 37%, 33% 0, 67% 0, 78% 37%, 100% 37%, 100% 100%);
      background: linear-gradient(180deg, #f1e1ba 0%, #dec89a 100%);
      color: var(--trim);
    }

    .flag {
      width: 1.95rem;
      height: 0.96rem;
      border-radius: 0.1rem;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.18);
    }

    .flag-left {
      justify-self: start;
      background: linear-gradient(180deg, #173e7a 0 50%, #fff 50% 100%);
    }

    .flag-right {
      justify-self: end;
      background: linear-gradient(180deg, #000 0 33%, #cf2f2f 33% 66%, #f0c42f 66% 100%);
    }

    .clock {
      width: 4.2rem;
      aspect-ratio: 1;
      border-radius: 999px;
      border: 0.28rem solid #7d6a43;
      background: #f9f5eb;
      position: relative;
    }

    .clock::before,
    .clock::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: bottom center;
      background: #52452e;
      border-radius: 999px;
    }

    .clock::before {
      width: 0.14rem;
      height: 1.14rem;
      transform: translateX(-50%) rotate(25deg);
    }

    .clock::after {
      width: 0.12rem;
      height: 0.78rem;
      transform: translateX(-50%) rotate(305deg);
    }

    .board {
      margin-top: -0.25rem;
      border: 0.2rem solid #dec27f;
      border-radius: 0.22rem;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.05), transparent 10%),
        linear-gradient(180deg, var(--board) 0%, var(--board-deep) 100%);
      box-shadow: inset 0 0 0 1px rgba(255,214,92,0.1);
      padding: 0.42rem 0.48rem 0.5rem;
      overflow: hidden;
    }

    .board-head {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.5rem;
      padding: 0 0.2rem 0.15rem;
      font-family: "Bebas Neue", sans-serif;
      color: var(--led);
      letter-spacing: 0.08em;
      font-size: clamp(0.95rem, 1.65vw, 1.45rem);
    }

    .board-head .versus {
      color: #fff2be;
    }

    .board-head .right {
      text-align: right;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      padding: 0.12rem 0.12rem 0.25rem;
      border-bottom: 1px solid var(--grid);
      font-family: "Bebas Neue", sans-serif;
      color: var(--led);
      font-size: clamp(0.78rem, 1.4vw, 1.15rem);
      letter-spacing: 0.08em;
      font-weight: 400;
      text-align: left;
      white-space: nowrap;
    }

    tbody td {
      padding: 0.15rem 0.12rem;
      border-bottom: 1px solid rgba(255,214,92,0.08);
      font-size: clamp(0.52rem, 1.04vw, 0.9rem);
      line-height: 1.04;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .summary-label {
      color: var(--led);
    }

    .summary-label.team {
      color: #fff7d1;
      text-align: center;
    }

    .summary-label.innings,
    .summary-label.major {
      font-family: "Bebas Neue", sans-serif;
      letter-spacing: 0.05em;
      font-size: 1.15em;
    }

    .summary-label.player {
      color: #fff8dc;
    }

    .summary-value,
    .out-code,
    .fall,
    .runs {
      color: var(--chalk);
      text-align: right;
    }

    .name {
      color: #fffdf7;
    }

    .num,
    .metric {
      color: var(--led);
      text-align: right;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      padding: 0.45rem 0.55rem 0;
      font-size: clamp(0.56rem, 0.96vw, 0.8rem);
      letter-spacing: 0.03em;
      color: #5a4a2c;
      flex-wrap: wrap;
    }

    .footer strong {
      color: #352a18;
    }

    .loading,
    .error {
      display: grid;
      place-items: center;
      min-height: 12rem;
      color: #fff7d1;
      text-align: center;
      padding: 2rem;
      letter-spacing: 0.04em;
    }

    @media (max-width: 720px) {
      body {
        padding: 0.45rem;
      }

      .scoreboard-shell {
        padding: 0.45rem 0.52rem 0.55rem;
        border-radius: 1.15rem 1.15rem 0.55rem 0.55rem;
      }

      .pediment {
        min-height: 4.7rem;
        padding: 0.9rem 0.68rem 0.42rem;
      }

      .clock {
        width: 3rem;
        border-width: 0.22rem;
      }

      .board {
        padding: 0.32rem;
      }

      .topbar {
        font-size: 0.76rem;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a href="/">Back to projects</a>
      <div class="note">Sample match data loaded</div>
    </div>

    <section class="scene">
      <div class="scoreboard-shell" id="scoreboard-root">
        <div class="loading">Loading scoreboard…</div>
      </div>
    </section>
  </main>

  <script>
    function shortName(fullName) {
      if (!fullName) return "";
      const parts = fullName.trim().split(/\s+/);
      if (parts.length === 1) return parts[0];
      return `${parts[0][0]}. ${parts[parts.length - 1]}`;
    }

    function cleanName(name) {
      if (!name) return "";
      return name
        .replace("(c)", "")
        .replace("†", "")
        .replace(/â€\u00a0|â€ |â€ |Ã¢â‚¬\u00a0|Ã¢â‚¬Â /g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function normaliseName(name) {
      if (!name) return "";
      return name
        .replace(/\(.*?\)/g, " ")
        .replace(/[^\w\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
    }

    function surname(name) {
      const parts = normaliseName(name).split(" ").filter(Boolean);
      return parts.length ? parts[parts.length - 1] : "";
    }

    function findMatchInScorecard(payload, matchId) {
      if (payload && typeof payload === "object" && payload.id) return payload;
      if (payload && typeof payload === "object" && payload.data) {
        if (payload.data.id) return payload.data;
        if (Array.isArray(payload.data)) {
          return payload.data.find((match) => match.id === matchId) || payload.data[0] || null;
        }
      }
      if (Array.isArray(payload)) {
        return payload.find((match) => match.id === matchId) || payload[0] || null;
      }
      return null;
    }

    function buildLookup(players) {
      const fullMap = new Map();
      const surnameMap = new Map();
      players.forEach((player, index) => {
        const number = index + 1;
        const rawName = player.name || "";
        const full = normaliseName(rawName);
        const last = surname(rawName);
        if (full) fullMap.set(full, number);
        if (last && !surnameMap.has(last)) surnameMap.set(last, number);
      });
      return { fullMap, surnameMap };
    }

    function getPlayerNumber(nameRaw, bowlingXi) {
      if (!nameRaw) return "";
      const { fullMap, surnameMap } = buildLookup(bowlingXi);
      const fullName = normaliseName(nameRaw);
      const lastName = surname(nameRaw);
      if (fullMap.has(fullName)) return String(fullMap.get(fullName));
      if (surnameMap.has(lastName)) return String(surnameMap.get(lastName));
      for (const [candidate, number] of fullMap.entries()) {
        if (candidate.endsWith(` ${lastName}`) || candidate.split(" ").slice(-1)[0] === lastName) {
          return String(number);
        }
      }
      return "#";
    }

    function dismissalCode(dismissalText, bowlingXi) {
      if (!dismissalText) return "";
      const raw = dismissalText.trim();
      const lowered = raw.toLowerCase();

      if (lowered.includes("run out")) return "RO";
      if (lowered === "batting" || lowered === "not out") return "*";

      let bowlerRaw = "";
      let prefix = "";

      if (lowered.includes(" b ")) {
        const splitIndex = lowered.lastIndexOf(" b ");
        prefix = raw.slice(0, splitIndex).trim();
        bowlerRaw = raw.slice(splitIndex + 3).trim();
      } else if (lowered.startsWith("b ")) {
        bowlerRaw = raw.slice(2).trim();
      } else {
        return raw.toUpperCase();
      }

      const bowlerNumber = getPlayerNumber(bowlerRaw, bowlingXi) || "#";
      const prefixLower = prefix.toLowerCase();

      if (prefixLower.startsWith("c") && (prefixLower.includes("and") || prefixLower === "c" || prefixLower === "c and")) {
        return `C${bowlerNumber} B${bowlerNumber}`;
      }

      if (prefixLower.startsWith("c ")) {
        const catcherRaw = prefix.slice(2).trim() || bowlerRaw;
        return `C${getPlayerNumber(catcherRaw, bowlingXi) || "#"} B${bowlerNumber}`;
      }

      if (prefixLower.startsWith("st ")) {
        const stumperRaw = prefix.slice(3).trim();
        return `ST${getPlayerNumber(stumperRaw, bowlingXi) || "#"} B${bowlerNumber}`;
      }

      if (prefixLower.startsWith("lbw")) return `LBW ${bowlerNumber}`;
      if (!prefix) return `B ${bowlerNumber}`;
      return raw.toUpperCase();
    }

    function buildTeamInningsMap(teams, scores) {
      const map = Object.fromEntries(teams.slice(0, 2).map((team) => [team, []]));
      scores.forEach((score) => {
        const inningName = score.inning || "";
        for (const team of Object.keys(map)) {
          if (inningName.toLowerCase().includes(team.toLowerCase())) {
            map[team].push(score);
            break;
          }
        }
      });
      return map;
    }

    function findCurrentBatters(currentInnings) {
      return (currentInnings.batting || [])
        .filter((batter) => {
          const dismissal = (batter["dismissal-text"] || batter.dismissal || "").toLowerCase();
          return dismissal === "batting" || dismissal === "not out";
        })
        .map((batter) => ({
          name: shortName(cleanName((batter.batsman || {}).name || "")),
          runs: batter.r || 0,
          balls: batter.b || 0
        }))
        .slice(0, 2);
    }

    function buildFallOfWickets(currentInnings) {
      return (currentInnings.batting || [])
        .filter((batter) => {
          const dismissal = (batter["dismissal-text"] || batter.dismissal || "").toLowerCase();
          return dismissal && dismissal !== "batting" && dismissal !== "not out";
        })
        .map((batter) => `${shortName(cleanName((batter.batsman || {}).name || ""))} ${batter.r || 0}`)
        .slice(0, 11);
    }

    function extractBattingXi(currentInnings) {
      return (currentInnings.batting || [])
        .map((entry) => ({ name: cleanName((entry.batsman || {}).name || "") }))
        .filter((player) => player.name);
    }

    function extractBowlingXi(currentInnings) {
      return (currentInnings.bowling || [])
        .map((entry) => ({ name: cleanName((entry.bowler || {}).name || "") }))
        .filter((player) => player.name);
    }

    function sumTeamRuns(scores, team) {
      return scores.reduce((sum, score) => {
        return (score.inning || "").toLowerCase().includes(team.toLowerCase()) ? sum + Number(score.r || 0) : sum;
      }, 0);
    }

    function prepareView(matchData) {
      const teams = matchData.teams || ["Home", "Away"];
      const scores = matchData.score || [];
      const scorecard = matchData.scorecard || [];
      const currentInnings = scorecard[scorecard.length - 1] || {};
      const currentInningName = currentInnings.inning || "";
      const status = matchData.status || "";
      const venue = matchData.venue || "";
      const teamInningsMap = buildTeamInningsMap(teams, scores);

      const battingSide = teams[0] && currentInningName.toLowerCase().includes(teams[0].toLowerCase())
        ? teams[0]
        : (teams[1] || teams[0]);

      let battingXi = extractBattingXi(currentInnings);
      let bowlingXi = extractBowlingXi(currentInnings);

      const batters = battingXi.map((player, index) => ({
        num: index + 1,
        name: player.name,
        displayName: shortName(player.name),
        runs: "",
        balls: "",
        bcode: ""
      }));

      const bowlers = bowlingXi.map((player, index) => ({
        num: index + 1,
        name: player.name,
        displayName: shortName(player.name),
        overs: "",
        maidens: "",
        wickets: "",
        runs: ""
      }));

      const totalsMap = Object.fromEntries(scores.map((score) => [score.inning || "", score]));

      const battingByName = Object.fromEntries(batters.map((row) => [row.name, row]));
      for (const entry of currentInnings.batting || []) {
        const name = cleanName((entry.batsman || {}).name || "");
        const row = battingByName[name];
        if (row) {
          row.runs = entry.r ?? 0;
          row.balls = entry.b ?? 0;
          row.bcode = dismissalCode(entry["dismissal-text"] || entry.dismissal || "", bowlingXi);
        }
      }

      const bowlingByName = Object.fromEntries(bowlers.map((row) => [row.name, row]));
      for (const entry of currentInnings.bowling || []) {
        const name = cleanName((entry.bowler || {}).name || "");
        const row = bowlingByName[name];
        if (row) {
          row.overs = entry.o ?? 0;
          row.maidens = entry.m ?? 0;
          row.wickets = entry.w ?? 0;
          row.runs = entry.r ?? 0;
        }
      }

      const currentTotals = totalsMap[currentInningName] || {};
      const currRuns = Number(currentTotals.r || 0);
      const currWickets = Number(currentTotals.w || 0);
      const currOvers = currentTotals.o || 0;
      const currentBatters = findCurrentBatters(currentInnings);
      const battingRuns = batters.reduce((sum, batter) => sum + (batter.runs === "" ? 0 : Number(batter.runs)), 0);
      const currExtras = Math.max(currRuns - battingRuns, 0);
      const fallOfWickets = buildFallOfWickets(currentInnings);

      let leadText = status;
      if (teams.length > 1) {
        const teamATotal = sumTeamRuns(scores, teams[0]);
        const teamBTotal = sumTeamRuns(scores, teams[1]);
        if (teamATotal === teamBTotal) leadText = "Scores level";
        else if (teamATotal > teamBTotal) leadText = `${teams[0]} lead by ${teamATotal - teamBTotal}`;
        else leadText = `${teams[1]} lead by ${teamBTotal - teamATotal}`;
      }

      function inningsText(team, index) {
        const innings = teamInningsMap[team] || [];
        if (index >= innings.length) return "";
        const item = innings[index];
        return `${item.w || 0}/${item.r || 0} (${item.o || 0} ov)`;
      }

      const summaryRows = [
        { label: teams[0] || "Home", value: "", kind: "team" },
        { label: "1st Innings", value: teams[0] ? inningsText(teams[0], 0) : "", kind: "innings" },
        { label: "2nd Innings", value: teams[0] ? inningsText(teams[0], 1) : "", kind: "innings" },
        { label: teams[1] || "Away", value: "", kind: "team" },
        { label: "1st Innings", value: teams[1] ? inningsText(teams[1], 0) : "", kind: "innings" },
        { label: "2nd Innings", value: teams[1] ? inningsText(teams[1], 1) : "", kind: "innings" },
        { label: "Wickets", value: String(currWickets), kind: "major" },
        { label: currentBatters[0]?.name || "Batter 1", value: currentBatters[0] ? `${currentBatters[0].runs} off ${currentBatters[0].balls}` : "", kind: "player" },
        { label: currentBatters[1]?.name || "Batter 2", value: currentBatters[1] ? `${currentBatters[1].runs} off ${currentBatters[1].balls}` : "", kind: "player" },
        { label: "Sundries", value: String(currExtras), kind: "major" },
        { label: "Total", value: `${currWickets}/${currRuns} (${currOvers} ov)`, kind: "major" },
        { label: "Match", value: leadText, kind: "major" }
      ];

      const rowCount = Math.max(summaryRows.length, bowlers.length, batters.length, fallOfWickets.length, 11);
      const rows = [];
      for (let index = 0; index < rowCount; index += 1) {
        rows.push({
          summary: summaryRows[index] || { label: "", value: "", kind: "" },
          bowler: bowlers[index] || {},
          batter: batters[index] || {},
          fall: fallOfWickets[index] || ""
        });
      }

      return {
        matchName: matchData.name || "Cricket Scoreboard",
        teams,
        status,
        venue,
        battingSide,
        rows,
        updatedTime: new Date().toLocaleString("en-AU", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }),
        dataMode: "Bundled sample scorecard"
      };
    }

    function renderScoreboard(view) {
      const root = document.getElementById("scoreboard-root");
      root.innerHTML = `
        <header class="pediment">
          <div class="flag flag-left" aria-hidden="true"></div>
          <div class="clock" aria-hidden="true"></div>
          <div class="flag flag-right" aria-hidden="true"></div>
        </header>

        <section class="board">
          <div class="board-head">
            <div>${view.teams[0] || "Home"}</div>
            <div class="versus">V</div>
            <div class="right">${view.teams[1] || "Away"}</div>
          </div>

          <table aria-label="Adelaide Oval style cricket scoreboard">
            <colgroup>
              <col style="width: 14.5%;">
              <col style="width: 15%;">
              <col style="width: 4%;">
              <col style="width: 15.5%;">
              <col style="width: 4.7%;">
              <col style="width: 4.7%;">
              <col style="width: 5.6%;">
              <col style="width: 5.6%;">
              <col style="width: 4%;">
              <col style="width: 15.5%;">
              <col style="width: 9%;">
              <col style="width: 5.8%;">
              <col style="width: 5.6%;">
              <col style="width: 11.5%;">
            </colgroup>
            <thead>
              <tr>
                <th>Summary</th>
                <th></th>
                <th>#</th>
                <th>Bowlers</th>
                <th>O</th>
                <th>M</th>
                <th>Wkts</th>
                <th>Runs</th>
                <th>#</th>
                <th>Batsmen</th>
                <th>Out B</th>
                <th>Runs</th>
                <th>Balls</th>
                <th>Fow</th>
              </tr>
            </thead>
            <tbody>
              ${view.rows.map((row) => `
                <tr>
                  <td class="summary-label ${row.summary.kind || ""}">${row.summary.label || ""}</td>
                  <td class="summary-value">${row.summary.value || ""}</td>
                  <td class="num">${row.bowler.num || ""}</td>
                  <td class="name">${row.bowler.displayName || ""}</td>
                  <td class="metric">${row.bowler.overs ?? ""}</td>
                  <td class="metric">${row.bowler.maidens ?? ""}</td>
                  <td class="metric">${row.bowler.wickets ?? ""}</td>
                  <td class="runs">${row.bowler.runs ?? ""}</td>
                  <td class="num">${row.batter.num || ""}</td>
                  <td class="name">${row.batter.displayName || ""}</td>
                  <td class="out-code">${row.batter.bcode || ""}</td>
                  <td class="runs">${row.batter.runs ?? ""}</td>
                  <td class="metric">${row.batter.balls ?? ""}</td>
                  <td class="fall">${row.fall || ""}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </section>

        <footer class="footer">
          <div><strong>Match:</strong> ${view.matchName}</div>
          <div><strong>Status:</strong> ${view.status}</div>
          <div><strong>Venue:</strong> ${view.venue}</div>
          <div><strong>Batting:</strong> ${view.battingSide}</div>
          <div><strong>Source:</strong> ${view.dataMode}</div>
          <div><strong>Updated:</strong> ${view.updatedTime}</div>
        </footer>
      `;
    }

    async function boot() {
      try {
        const response = await fetch("./match_scorecard.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const matchData = findMatchInScorecard(payload, "755ec194-5d09-445d-aeb1-42fedae0b83d");
        if (!matchData) throw new Error("No match data found in bundled scorecard.");
        renderScoreboard(prepareView(matchData));
      } catch (error) {
        document.getElementById("scoreboard-root").innerHTML = `
          <div class="error">
            <div>
              <div>Scoreboard preview failed to load.</div>
              <div style="margin-top:0.5rem; color:#d8c590; text-transform:none;">${error.message}</div>
            </div>
          </div>
        `;
      }
    }

    boot();
  </script>
</body>
</html>
